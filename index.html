const STYLES = { tranquila:[300,900], equilibrada:[180,480], conversadeira:[90,300] };
const STYLE_LABEL = { tranquila:'Tranquila', equilibrada:'Equilibrada', conversadeira:'Conversadeira' };
A.comp = { listened:0, uStart:0, from:null, inflight:false, question:null, awaiting:null, doc:null, calls:0, greeted:false, booting:false };
const C = A.comp;
const compOn = () => !!(A.meta && A.meta.companion && A.sample);
const compRef = (id) => S.db.doc('companion/' + (id || S.cur));
const journalCol = (id) => S.db.collection('companion/' + (id || S.cur) + '/journal');
const WAKE_RE = /^.*?\b(?:ei|hey|oi|olá|ola)?[,\s]*(?:maggie|magg?ie|mag+i|magui|meg+ie|meg+i|meg|margin[aá]lia|marginal|claude|cloud)\b[,.!:\s]*/i;
const stripWake = t => t.replace(WAKE_RE, '').trim();
const hasSpeechCache = new Map();
function paraHasSpeech(pi){
  if (!hasSpeechCache.has(pi)) hasSpeechCache.set(pi, !!S.paras[pi] && segPara(S.paras[pi].t).some(s => s.sp));
  return hasSpeechCache.get(pi);
}
const isBreak = pi => !!S.paras[pi] && (S.paras[pi].h || /^[\W\d_]{1,12}$/.test(S.paras[pi].t.trim()));
function isNaturalPoint(idx){
  const u = A.units[idx], nx = A.units[idx+1];
  if (!nx) return true;
  if (nx.pi === u.pi) return false;
  if (isBreak(nx.pi)) return true;
  let talk = 0; for (let k = Math.max(0, u.pi - 5); k <= u.pi; k++) if (paraHasSpeech(k)) talk++;
  return talk >= 3 && !paraHasSpeech(nx.pi) && !paraHasSpeech(nx.pi + 1);
}
function newDoc(){ return { recap:'', ondeParamos:'', opinions:'', chars:{}, recent:[], lastPos:null, bets:[], stats:{ asked:0, answered:0, skipped:0, chars:0 }, style:'equilibrada', lastHeard:0 }; }
async function compLoad(){
  C.doc = null; C.question = null; C.awaiting = null; C.listened = 0; C.greeted = false; hasSpeechCache.clear();
  if (!S.db) return;
  try { const s = await compRef().get(); if (s.exists) C.doc = { ...newDoc(), ...JSON.parse(JSON.stringify(s.data())) }; } catch {}
  if (!C.doc) C.doc = newDoc();
  if (!C.doc.chars || typeof C.doc.chars !== 'object') C.doc.chars = {};
  C.prevHeard = C.doc.lastHeard || 0;
}
function compStartFrom(pi){
  const lp = C.doc?.lastPos;
  if (lp && lp.pi <= pi && pi - lp.pi <= 40) C.from = { pi: lp.pi, b: lp.b };
  else C.from = { pi: Math.max(A.chapters[chapOf(pi)].start, pi - 12), b: 0 };
}

/* Text between two positions (never beyond `to`), with who-is-speaking tags from the
   dramatized analysis of lines already heard, and chapter titles marked. Book text itself is untouched. */
function passage(from, to, max){
  const castName = id => id && id !== 'narr' ? (A.meta?.cast?.[id]?.name || '') : '';
  const out = [];
  for (let pi = from.pi; pi <= to.pi; pi++){
    const t = S.paras[pi].t, a0 = pi === from.pi ? from.b : 0, b0 = pi === to.pi ? to.b : t.length;
    if (b0 <= a0) continue;
    if (S.paras[pi].h){ out.push(`## ${t.slice(a0, b0).trim()}`); continue; }
    let line = '';
    for (const sg of segPara(t)){
      const a = Math.max(sg.a, a0), b = Math.min(sg.b, b0); if (b <= a) continue;
      const piece = t.slice(a, b);
      const who = sg.sp && A.meta?.mode === 'drama' ? castName(A.labels[`${pi}:${sg.a}`]) : '';
      line += who ? `[${who}]${piece}` : piece;
    }
    if (line.trim()) out.push(line.trim());
  }
  const s = out.join('\n');
  return s.length > max ? '…' + s.slice(s.length - max) : s;
}
function povNote(pi){
  const ch = A.chapters[chapOf(pi)];
  const first = A.meta?.narrator?.pessoa === 'primeira';
  const povId = A.meta?.plan?.pov?.[chapOf(pi)], povName = povId && A.meta.cast?.[povId]?.name;
  if (povName) return `Capítulo atual: "${ch?.label || ''}". Este capítulo é narrado em primeira pessoa por ${povName}: o "eu" do texto é ${povName}. Falas marcadas como [Nome] indicam quem fala, segundo a análise de vozes (pode errar; na dúvida, confie no texto).`;
  return `Capítulo atual: "${ch?.label || ''}".${first ? ' O livro é narrado em primeira pessoa e o "eu" muda conforme o capítulo: confira no título do capítulo e no próprio texto quem é o "eu" antes de citar alguém.' : ''} Falas marcadas como [Nome] indicam quem fala, segundo a análise de vozes (pode errar; na dúvida, confie no texto).`;
}
function charsBrief(){
  const ppl = peopleOf(C.doc);
  const e = Object.entries(ppl);
  return e.length ? e.map(([n, p]) => `- ${n}${p.age ? `, ${p.age}${/^\d+$/.test(p.age) ? ' anos' : ''}` : ''}: ${p.role}${Object.keys(p.rel || {}).length ? ' (' + Object.entries(p.rel).map(([k, v]) => `${k}: ${v}`).join('; ') + ')' : ''}`).join('\n') : '(ainda vazio)';
}
function mergeChars(upd){
  if (!upd || typeof upd !== 'object') return;
  if (!C.doc.people || typeof C.doc.people !== 'object') C.doc.people = peopleOf(C.doc);
  const cur = C.doc.people;
  for (const [n0, d] of Object.entries(upd)){
    const n = clean(n0, 40); if (!n) continue;
    const p = cur[n] || (cur[n] = { age:'', role:'', rel:{} });
    if (typeof d === 'string'){ if (clean(d, 220)) p.role = clean(d, 220); continue; }
    if (!d || typeof d !== 'object') continue;
    const age = clean(String(d.idade ?? ''), 20); if (age && !/^(\?|indefinid|desconhecid)/i.test(age)) p.age = age.replace(/\s*anos?$/i, '');
    if (clean(d.papel, 160)) p.role = clean(d.papel, 160);
    if (d.relacoes && typeof d.relacoes === 'object') for (const [k, v] of Object.entries(d.relacoes)){ const kk = clean(k, 30), vv = clean(String(v), 80); if (kk && vv) p.rel[kk] = vv; }
  }
  const keys = Object.keys(cur); if (keys.length > 24) keys.slice(0, keys.length - 24).forEach(k => delete cur[k]);
}
const storyNum = c => (A.chapters.slice(0, c + 1).filter(x => x.title).length) || (c + 1);
function addFacts(list, pi){
  if (!Array.isArray(list)) return;
  const c = chapOf(pi), label = A.chapters[c]?.label || '';
  const have = new Set((C.doc.facts || []).map(f => norm(f.t)));
  const add = list.map(x => clean(x, 90)).filter(x => x && !have.has(norm(x))).slice(0, 4).map(t => ({ t, pi, c, cn: storyNum(c), label }));
  C.doc.facts = [...(C.doc.facts || []), ...add].slice(-200);
}
function gaps(){
  let [mn, mx] = STYLES[C.doc?.style] || STYLES.equilibrada;
  const st = C.doc?.stats || {};
  if (st.asked >= 3){
    const skip = st.skipped / st.asked, ans = st.answered / st.asked, avg = st.answered ? st.chars / st.answered : 0;
    if (skip > 0.5){ mn *= 1.5; mx *= 1.5; } else if (ans > 0.8 && avg > 40){ mn *= 0.75; mx *= 0.75; }
  }
  return [mn, mx];
}
function mood(){
  const st = C.doc?.stats || {}, style = C.doc?.style || 'equilibrada';
  let m = { tranquila:'baixa: só interrompa em momentos realmente fortes', equilibrada:'média', conversadeira:'alta: ela adora conversar, pode interromper em momentos interessantes' }[style];
  if (st.asked >= 3 && st.skipped / st.asked > 0.5) m += '. Ela tem pulado muitas perguntas: seja mais seletiva';
  if (st.asked >= 3 && st.answered / st.asked > 0.8 && st.chars / Math.max(1, st.answered) > 40) m += '. Ela tem respondido com vontade';
  return m;
}
const PERSONA = `Você é a Maggie, amiga de leitura da leitora. Vocês estão lendo o mesmo livro juntas, no mesmo ritmo.
Seu jeito: esperta, divertida, com opinião própria, um pouco fofoqueira sobre os personagens, fala como uma amiga brasileira no áudio do WhatsApp. Nada de tom de professora ou de entrevista.
Como conversar bem:
- Traga algo que ela não disse: uma observação afiada, uma contradição que você notou, uma ligação com algo que aconteceu antes, uma opinião sua sobre um personagem.
- Nunca repita o que acabou de acontecer na história nem concorde por concordar. Ruim: "Nossa, é verdade, ela realmente apertou a fivela." Bom: "E reparou que ela só fica quieta quando o pai está por perto? Isso me pegou."
- Seja específica com nomes e detalhes do texto. Frases curtas, naturais.`;
const NO_SPOILER = `Regras inegociáveis:
- Você só conhece o texto que aparece aqui. Mesmo que reconheça a obra, NÃO use nenhum conhecimento externo sobre ela.
- Nunca antecipe acontecimentos, nunca confirme nem negue teorias, nunca sugira suspeitos ou pistas.
- Não diga "preste atenção nisso", "você vai descobrir" ou "isso será importante".`;
const clean = (x, n) => typeof x === 'string' ? x.trim().slice(0, n) : '';
const userName = () => (window.marginaliaUserName && window.marginaliaUserName()) || '';
const nameLine = () => userName() ? `\nO nome da leitora é ${userName()}.` : '';
const cleanOpts = o => Array.isArray(o) ? o.map(x => clean(x, 40)).filter(Boolean).slice(0, 3) : [];
function quoteIn(q, text){ q = clean(q, 220).replace(/^["“'‘]|["”'’]$/g, ''); return q.length > 8 && text.includes(q) ? q : ''; }

function compAfterUnit(u, idx){
  if (!compOn()) return false;
  C.listened += Math.max(0, (Date.now() - (C.uStart || Date.now())) / 1000);
  C.doc.lastHeard = Date.now();
  if (C.question){ const q = C.question; C.question = null; A.idx = idx + 1; askCompanion(q); return true; }
  if (C.inflight || !C.from) return false;
  const [mn, mx] = gaps(), endOfChapter = !A.units[idx+1];
  if ((endOfChapter && C.listened >= Math.min(60, mn)) || (C.listened >= mn && (isNaturalPoint(idx) || C.listened >= mx))) compCheck(u);
  return false;
}

/* one-time catch-up when the companion starts in the middle of a book: builds the recap and the
   character notes from what was already read (never beyond the current sentence) */
async function compBootstrap(to){
  if (C.doc.recap && Object.keys(C.doc.chars || {}).length) return;
  if (to.pi < 15) return;
  let text = passage({ pi:0, b:0 }, to, 200000);
  if (text.length > 60000) text = text.slice(0, 18000) + '\n[…]\n' + text.slice(-42000);
  const prompt = `Você vai acompanhar uma leitora num livro que ela já começou. Leia o que ela já leu e prepare suas anotações.
${NO_SPOILER}
${povNote(to.pi)}

Texto já lido:
"""
${text}
"""

Responda só com JSON:
{"resumo":"o que aconteceu até aqui, em até 150 palavras","ondeParamos":"onde a história parou, em 1 ou 2 frases","personagens":{"Nome":{"idade":"só o número, se o texto disser; senão vazio","papel":"quem é, em até 12 palavras","relacoes":{"mãe":"Nome","pai":"Nome","irmã":"Nome","marido":"Nome","prima":"Nome","amiga":"Nome"}}}}
Inclua até 15 personagens que já apareceram. Em "relacoes", a chave é o que a outra pessoa é PARA este personagem (para a filha: "mãe":"Emily"). Só relações que o texto deixou claras.`;
  try {
    const r = await A.sample.json(prompt, { modelTier:'quick', cache:false });
    if (clean(r?.resumo, 1200)) C.doc.recap = clean(r.resumo, 1200);
    if (clean(r?.ondeParamos, 300)) C.doc.ondeParamos = clean(r.ondeParamos, 300);
    mergeChars(r?.personagens);
    compSave();
  } catch {}
}

async function compCheck(u){
  const L = A.lastFinishedUnit;
  if (!L || L.pi !== u.pi || L.b !== u.b) return;              // context ends at the last finished sentence
  return compCheckAt({ pi:u.pi, b:u.b }, 'audio');
}
async function compCheckAt(to, src){
  const u = { pi: to.pi, b: to.b }, from = C.from, reading = src === 'leitura';
  if (!from) return;
  if (from.pi > to.pi || (from.pi === to.pi && from.b >= to.b)){ C.from = { pi: Math.max(A.chapters[chapOf(u.pi)].start, u.pi - 12), b:0 }; return; }
  const text = passage(from, to, 8000);
  if (text.length < 400) return;
  C.inflight = true; C.from = to; C.listened = 0;
  try {
    $('#ab-comp').classList.add('thinking');
    await compBootstrap({ pi: from.pi, b: from.b });
    const recent = (C.doc.recent || []).slice(-4).map(x => `- ${x.q} → ela: ${x.a || '(pulou)'}`).join('\n');
    const bets = (C.doc.bets || []).filter(b => b.status === 'aberta').slice(-6).map(b => `- [${b.id}] Você perguntou: "${b.q}" Ela apostou: "${b.a}"`).join('\n');
    const prompt = `${PERSONA}${nameLine()}
${reading ? 'Ela está lendo o livro em silêncio, virando as páginas. De tempos em tempos você pode puxar conversa, mas só quando valer a pena.' : 'Ela está ouvindo o audiobook. De tempos em tempos você pode pausar para conversar, mas só quando valer a pena.'}

${NO_SPOILER}

${povNote(u.pi)}
Quem é quem (suas anotações, só com o que já foi lido):
${charsBrief()}
Resumo do que veio antes: ${C.doc.recap || '(início da escuta)'}
O que ela já disse que pensa: ${C.doc.opinions || '(nada ainda)'}
Conversas recentes:
${recent || '(nenhuma)'}
Apostas dela ainda em aberto:
${bets || '(nenhuma)'}
Vontade dela de conversar agora: ${mood()}.

Trecho que ela acabou de ${reading ? 'ler' : 'ouvir'}:
"""
${text}
"""

Decida:
1. Se o trecho resolve claramente alguma aposta em aberto (o próprio texto mostra a resposta), preencha "aposta_resolvida". Isso tem prioridade.
2. Senão, veja se há um bom motivo para conversar: revelação, atitude inesperada, mudança numa relação, momento emocional forte, contradição entre dizer e fazer, ou algo que pode mudar uma impressão que ela já contou. Se não houver, não interrompa.
3. Antes de citar alguém, confira no texto quem disse ou fez aquilo. Se não tiver certeza de quem foi, não interrompa.
4. Se interromper: "reacao" é sua reação espontânea e com personalidade (até 14 palavras, sem pergunta). "pergunta" é UMA pergunta curta (até 20 palavras), concreta, que ela tenha vontade de responder, diferente das recentes. "tipo":"aposta" quando pedir um palpite sobre algo ainda sem resposta; senão "pergunta". "opcoes": 2 ou 3 respostas curtas que ela poderia tocar (até 4 palavras).

Responda só com JSON:
{"interromper":false,"tipo":"pergunta","reacao":"","pergunta":"","opcoes":[],"aposta_resolvida":null,"resumo":"resumo atualizado da história até o fim deste trecho, em até 150 palavras","ondeParamos":"onde a história parou, em 1 ou 2 frases curtas","personagens":{"Nome":{"idade":"só o número, se o texto disser; senão vazio","papel":"quem é, em até 12 palavras","relacoes":{"mãe":"Nome","pai":"Nome","irmã":"Nome","marido":"Nome","prima":"Nome","amiga":"Nome"}},"fatos":["até 4 descobertas marcantes deste trecho, até 9 palavras cada, como itens de lista"]}
Em "personagens" inclua só quem apareceu ou teve informação nova neste trecho. Em "relacoes", a chave é o que a outra pessoa é PARA este personagem; só relações claras no texto. Em "fatos", nada que já esteja no resumo; pode ser vazio.
Formato de "aposta_resolvida" quando houver: {"id":"b123","resultado":"acertou|errou|parcial","comentario":"fala curta lembrando a aposta dela"}`;
    C.calls++;
    const ctl = new AbortController(); const wd = setTimeout(() => ctl.abort(), 90000);
    let r; try { r = await A.sample.json(prompt, { modelTier:'quick', cache:false, signal: ctl.signal }); } finally { clearTimeout(wd); }
    if (clean(r?.resumo, 1200)) C.doc.recap = clean(r.resumo, 1200);
    if (clean(r?.ondeParamos, 300)) C.doc.ondeParamos = clean(r.ondeParamos, 300);
    mergeChars(r?.personagens);
    addFacts(r?.fatos, to.pi);
    C.doc.lastPos = to;
    C.doc.lastCheck = { at: Date.now(), pi: to.pi, chars: text.length, asked: !!r?.interromper, resolved: !!r?.aposta_resolvida };
    const res = r?.aposta_resolvida, bet = res && (C.doc.bets || []).find(b => b.id === res.id && b.status === 'aberta');
    if (bet && /acertou|errou|parcial/.test(res.resultado) && clean(res.comentario, 300)){
      bet.status = res.resultado; bet.resolvedAt = Date.now(); bet.resolvedPi = to.pi;
      C.question = { kind:'retorno', reacao:'', q: clean(res.comentario, 300), opcoes:['Eu sabia!', 'Não acredito', 'Depois'], bet: bet.id, betQ: bet.q, betA: bet.a, result: bet.status, pi: to.pi, b: to.b, passage: text.slice(-3500) };
    } else if (r?.interromper && clean(r.pergunta, 240)){
      C.question = { kind: r.tipo === 'aposta' ? 'aposta' : 'pergunta', reacao: clean(r.reacao, 140), q: clean(r.pergunta, 240), opcoes: cleanOpts(r.opcoes), pi: to.pi, b: to.b, passage: text.slice(-3500) };
    }
    if (reading){
      const q = C.question; C.question = null;
      if (q && readOn() && !C.awaiting) setTimeout(() => askCompanion(q), 0);
    } else if (C.question && !A.playing) C.question = null;
    compSave();
  } catch (e) {
    if (e?.code === 'not_granted' || e?.code === 'sampling_disabled'){ A.sample = null; toast('A Maggie não conseguiu falar com a IA agora.'); paintAb(); }
    else if (e?.code === 'rate_limited') toast('Maggie em pausa: limite diário da IA atingido.');
    C.doc.lastCheck = { at: Date.now(), pi: to.pi, error: String(e?.code || e) };
    compSave();
  } finally { C.inflight = false; $('#ab-comp').classList.remove('thinking'); }
}
let compSaveT;

  clearTimeout(compSaveT);
  const id = S.cur, data = JSON.parse(JSON.stringify(C.doc || {}));
  const run = async () => { try { if (C.doc) await compRef(id).set(data); } catch {} };
  if (now) return run(); compSaveT = setTimeout(run, 600);
}

const chips = $('#comp-chips');
function showChips(list){
  const opts = [...(list || []), 'Depois'].filter((x, i, a) => a.indexOf(x) === i).slice(0, 4);
  chips.innerHTML = opts.map(o => `<button class="chip-r" data-reply="${esc(o)}">${esc(o)}</button>`).join('');
  chips.hidden = false;
}
function hideChips(){ chips.hidden = true; chips.innerHTML = ''; }
chips.addEventListener('click', e => { const b = e.target.closest('[data-reply]'); if (!b) return; e.stopPropagation(); clearTimeout(answerT); runCommand(b.dataset.reply); });

/* ---- names she mentions: find what the read text says about them ---- */
function knownNames(){
  const n = new Set(Object.keys(C.doc?.chars || {}));
  if (A.meta) visibleCast().forEach(([,c]) => c.name && n.add(c.name));
  return [...n];
}
function mentions(q, lim){
  const nq = ' ' + norm(q) + ' ';
  let names = knownNames().filter(n => { const k = norm(n).split(' ')[0]; return k.length > 2 && nq.includes(' ' + k + ' '); });
  const caps = (q.match(/\b[A-ZÀ-Ý][a-zà-ÿ]{2,}\b/g) || []).filter(w => !/^(Ei|Oi|Maggie|Marginália|Claude|Quem|Qual|Que|Como|Por|Onde|Quando|Você|Voce|Ela|Ele|Eu|Mas|Sim|Não|Nao)$/.test(w));
  names = [...new Set([...names, ...caps])].slice(0, 3);
  if (!names.length) return '';
  const hits = [];
  for (let pi = 0; pi <= lim.pi; pi++){
    const t = pi === lim.pi ? S.paras[pi].t.slice(0, lim.b) : S.paras[pi].t;
    if (names.some(n => t.includes(n))) for (const [a,b] of sentences(t, 0, t.length)){ const s = t.slice(a,b); if (names.some(n => s.includes(n))) hits.push(s.trim()); }
  }
  const pick = hits.length > 10 ? [...hits.slice(0, 4), ...hits.slice(-6)] : hits;
  return pick.join(' … ').slice(0, 2500);
}

/* ---- conversation: one question, one answer, one reply, then back to the book ---- */
let answerT;
function armAnswerTimer(){ clearTimeout(answerT); answerT = setTimeout(() => { if (C.awaiting && !vc.value.trim()) endConversation('timeout'); }, 40000); }
function holdForCompanion(){ stopSpeech(); if (A.playing){ A.playing = false; V.wasPlaying = true; } else if (!V.hold) V.wasPlaying = false; V.hold = true; vcBox.classList.add('listening'); paintAb(); }
function waitAnswer(text, opts){
  vc.placeholder = fine ? 'Sua resposta: toque, Win + H ou digite' : 'Sua resposta: toque ou use o microfone';
  $('#ab-status').textContent = text; $('#ab-status').classList.add('ask'); clearTimeout(V.msgT);
  showChips(opts); keepFocus(); armAnswerTimer();
}
async function askCompanion(q){
  if (!A.on) showReadBar();
  holdForCompanion(); V.wasPlaying = true;
  C.awaiting = { ...q, turns:[], current:q.q };
  C.doc.stats.asked++;
  paintAb();
  if (q.reacao) maggieAudio(q.reacao); maggieAudio(q.q);   // fabrica as duas falas ao mesmo tempo
  if (q.reacao) await say(q.reacao);
  if (!C.awaiting) return;
  await say(q.q);
  if (!C.awaiting) return;
  waitAnswer(q.q, q.opcoes);
}
const SKIP_RE = /^(continuar|continua|continue|pula|pular|nao quero responder|nao quero falar|agora nao|depois|deixa|pode seguir|podemos continuar|vamos seguir|segue|seguir|prefiro nao)\b/;
const asksBack = t => /\?/.test(t) || /\b(quem|qual|quais|quanto|quantos|quantas|por que|porque que|pq|como assim|como|quando|onde|o que|sera que|voce acha|vc acha|lembra)\b/.test(norm(t));
const DIARY_SPEC = `Escreva também a página do diário de leitura de vocês sobre este momento:
"titulo" (até 6 palavras, bonito), "frase" (uma frase de efeito curta, até 14 palavras, como uma legenda de foto), "texto" (até 45 palavras: o que aconteceu na conversa e o que ela sentiu, com carinho), "citacao" (um trecho curto COPIADO EXATAMENTE do texto do livro acima, ou vazio), "humor" (uma palavra: tensa, chocada, emocionada, divertida, desconfiada, apaixonada, triste, curiosa, revoltada).`;
async function compAnswer(raw){
  const aw = C.awaiting; if (!aw) return;
  clearTimeout(answerT); hideChips();
  const ans = stripWake(raw) || raw.trim();
  if (!norm(ans) || SKIP_RE.test(norm(ans))) return endConversation('skip');
  C.doc.stats.answered++; C.doc.stats.chars += ans.length;
  if (aw.kind === 'aposta'){
    aw.betId = 'b' + Date.now().toString(36);
    C.doc.bets = [...(C.doc.bets || []), { id: aw.betId, q: aw.q, a: ans.slice(0, 200), pi: aw.pi, chap: A.chapters[A.chap]?.label || '', status:'aberta', at: Date.now() }].slice(-30);
  }

// Limite anti-spoiler: só entra o que estava em páginas que a leitora já terminou de ler.
const R = { secs:0, pageAt:Date.now() };
function readOn(){ return !!(C.doc?.reading && A.sample && S.paras && A.bookId === S.cur && !A.on && !rd.hidden); }
function readNatural(pi){
  if (!S.paras[pi + 1]) return true;
  if (isBreak(pi + 1)) return true;
  const c = A.chapters[chapOf(pi)]; if (c && c.end === pi) return true;
  let talk = 0; for (let k = Math.max(0, pi - 5); k <= pi; k++) if (paraHasSpeech(k)) talk++;
  return talk >= 3 && !paraHasSpeech(pi + 1) && !paraHasSpeech(pi + 2);
}
// Último parágrafo inteiramente lido antes da página `n`
function lastReadBefore(kind, n){
  let to = -1;
  if (kind === 'flow'){
    for (let pi = 0; pi < S.paras.length; pi++){
      const st = S.pageOf[pi], nx = S.pageOf[pi + 1];
      if (st == null || st > n - 1) break;
      if (nx != null && nx <= n - 1) to = pi;
    }
  } else {
    for (let pi = 0; pi < S.paras.length; pi++){ if ((S.paras[pi].p || 0) <= n - 1) to = pi; else break; }
  }
  return to;
}
function readTurn(kind, prev, n){
  const now = Date.now(), dt = Math.min(120, (now - R.pageAt) / 1000); R.pageAt = now;
  if (!(n > prev && n - prev <= 2)) return;           // só virada de página para frente (não saltos no índice)
  R.secs += dt;
  if (!readOn() || C.inflight || C.awaiting) return;
  const to = lastReadBefore(kind, n); if (to < 0) return;
  if (!C.readMax || to > C.readMax.pi) C.readMax = { pi:to, b:S.paras[to].t.length };
  if (!C.from || C.from.pi > to) compStartFrom(to);
  const [mn, mx] = gaps();
  let cut = -1;
  for (let pi = to; pi > (C.from?.pi ?? -1) && pi >= to - 60; pi--) if (readNatural(pi)){ cut = pi; break; }
  if (R.secs >= mn && (cut >= 0 || R.secs >= mx)){
    const at = cut >= 0 ? cut : to; R.secs = 0;
    compCheckAt({ pi:at, b:S.paras[at].t.length }, 'leitura');
  }
}

/* people: structured notes { name: { age, role, rel:{ relation: name } } } */
function peopleOf(doc){
  const out = {};
  const src = doc?.people && typeof doc.people === 'object' ? doc.people : {};
  for (const [n, p] of Object.entries(src)) if (p && typeof p === 'object') out[n] = { age: String(p.age || '').trim(), role: String(p.role || '').trim(), rel: p.rel && typeof p.rel === 'object' ? p.rel : {} };
  if (!Object.keys(out).length && doc?.chars && typeof doc.chars === 'object')
    for (const [n, d] of Object.entries(doc.chars)) out[n] = { age: (String(d).match(/(\d{1,3}) anos/) || [])[1] || '', role: String(d), rel: {} };
  return out;
}
const relKey = k => deacc(String(k).toLowerCase()).trim();
function familyOf(people){
  const names = Object.keys(people);
  const find = v => { const t = deacc(String(v).toLowerCase()).trim(); return names.find(n => deacc(n.toLowerCase()) === t) || names.find(n => deacc(n.toLowerCase()).split(' ')[0] === t.split(' ')[0]) || null; };
  const parents = {}, spouse = new Set(), sib = [], links = [], add = (m, k, v) => (m[k] || (m[k] = new Set())).add(v);
  for (const x of names){
    for (const [k, v] of Object.entries(people[x].rel || {})){
      const r = relKey(k);
      for (const raw of String(v).split(/,| e /)){
        const y = find(raw); if (!y || y === x) continue;
        if (/^(mae|pai|madrasta|padrasto)$/.test(r)) add(parents, x, y);
        else if (/^(filh[oa]s?|enteado|enteada)$/.test(r)) add(parents, y, x);
        else if (/^(marido|esposa|mulher|esposo|casad[oa]|companheir[oa]|parceir[oa])/.test(r)) spouse.add([x, y].sort().join('|'));
        else if (/^irm[aã]o?s?$|^irma$|^irmao$/.test(r)) sib.push([x, y]);
        else links.push([x, k, y]);
      }
    }
  }
  // siblings share parents
  for (let pass = 0; pass < 2; pass++) for (const [x, y] of sib){ const px = parents[x], py = parents[y]; if (px && !py) parents[y] = new Set(px); else if (py && !px) parents[x] = new Set(py); }
  const groups = new Map();
  for (const [c, ps] of Object.entries(parents)){ const key = [...ps].sort().join('|'); if (!groups.has(key)) groups.set(key, { parents: [...ps].sort(), kids: [] }); groups.get(key).kids.push(c); }
  for (const pair of spouse){ const [a, b] = pair.split('|'); const g = [...groups.values()].find(g => g.parents.includes(a) || g.parents.includes(b)); if (g){ if (!g.parents.includes(a)) g.parents.push(a); if (!g.parents.includes(b)) g.parents.push(b); } else groups.set(pair, { parents:[a, b], kids:[] }); }
  const inTree = new Set(); groups.forEach(g => { g.parents.forEach(p => inTree.add(p)); g.kids.forEach(k => inTree.add(k)); });
  for (const [x, y] of sib) if (!parents[x] && !parents[y]){ const key = 'sib|' + [x, y].sort().join('|'); if (!groups.has(key)) groups.set(key, { parents:[], kids:[x, y].sort() }); inTree.add(x); inTree.add(y); }
  const seen = new Set();
  const laces = links.filter(([x, k, y]) => { const id = [x, y].sort().join('|') + relKey(k); if (seen.has(id)) return false; seen.add(id); return true; });
  const loose = names.filter(n => !inTree.has(n));
  return { groups: [...groups.values()].sort((a, b) => (b.kids.length + b.parents.length) - (a.kids.length + a.parents.length)), laces, loose };
}

}

        ${g.kids.length ? `<div class="ft-kids ${g.parents.length ? '' : 'solo'}">${g.kids.map(n => personChip(n, people[n])).join('')}</div>` : ''}
      </div>`).join('');
    const laces = fam.laces.map(([x, k, y]) => `<li><b>${esc(y)}</b><span>${esc(k)} de</span><b>${esc(x)}</b></li>`).join('');
    pages.push(`<h3 class="dy-h">Quem é quem</h3><p class="dy-sub">o que sabemos até agora</p>
      <div class="ft-wrap">${tree || '<p class="dy-empty">Ainda sem laços de família conhecidos.</p>'}</div>
      ${laces ? `<h4 class="dy-h4">outros laços</h4><ul class="dy-laces">${laces}</ul>` : ''}`);
    pages.push(`<h3 class="dy-h">Personagens</h3><p class="dy-sub">fichas atualizadas pela Maggie</p>
      <div class="dy-people">${Object.entries(people).map(([n, p]) => `<div class="dy-person">
        <div class="dy-pn"><b>${esc(n)}</b>${p.age ? `<span>${esc(p.age)}${/^\d+$/.test(p.age) ? ' anos' : ''}</span>` : ''}</div>
        ${p.role ? `<p>${esc(p.role)}</p>` : ''}
      </div>`).join('')}</div>`);
  }
  if (bets.length){
    pages.push(`<h3 class="dy-h">Apostas</h3><p class="dy-sub">seus palpites, guardados pela Maggie</p>
      <ul class="dy-bets">${bets.map(bt => `<li><p class="q">${esc(bt.q)}</p><p class="a">“${esc(bt.a)}”</p><span class="jn-stamp st-${esc(bt.status)}">${esc(RESULT[bt.status] || bt.status)}</span></li>`).join('')}</ul>`);
  }
  // chapters, in reading order; empty chapters are skipped
  const groups = [];
  const keyOf = x => x.c != null ? 'c' + x.c : 'l' + (x.chap || x.label || '');
  const items = [...jEntries.map(e => ({ type:'e', pi: e.pi ?? 0, c: e.c, cn: e.cn, label: e.chap, e })), ...facts.map(f => ({ type:'f', pi: f.pi ?? 0, c: f.c, cn: f.cn, label: f.label, f }))].sort((a, b) => a.pi - b.pi);
  for (const it of items){
    const last = groups[groups.length - 1];
    if (last && (it.c != null && last.c != null ? it.c === last.c : (it.label || '') === (last.label || ''))){ last.items.push(it); if (it.cn && !last.cn) last.cn = it.cn; }
    else groups.push({ c: it.c, cn: it.cn, label: it.label, items:[it] });
  }
  for (const g of groups){
    const fs = g.items.filter(i => i.type === 'f'), es = g.items.filter(i => i.type === 'e');
    const title = g.cn ? `Capítulo ${g.cn}` : 'Capítulo';
    pages.push(`<div class="dy-ch"><small>${esc(title)}</small><h3>${esc(g.label && g.label !== title ? g.label : '')}</h3></div>
      ${fs.length ? `<h4 class="dy-h4">o que descobrimos</h4><ul class="dy-facts">${fs.map(i => `<li>${esc(i.f.t)}</li>`).join('')}</ul>` : ''}
      ${es.map(i => { const e = i.e, st = betStatus(e); return `<article class="dy-entry" data-jn="${e.id}">
        ${e.quote ? `<blockquote>“${esc(e.quote)}”</blockquote>` : ''}
        <h5>${esc(e.title)}</h5>
        ${e.phrase ? `<p class="dy-phrase">${esc(e.phrase)}</p>` : ''}
        ${e.question ? `<p class="dy-line"><b>Maggie</b>${esc(e.question)}</p>` : ''}
        ${e.answer ? `<p class="dy-line you"><b>Você</b>${esc(e.answer)}</p>` : ''}
        <div class="dy-tags">${e.mood ? `<span class="jn-mood">${esc(e.mood)}</span>` : ''}${st ? `<span class="jn-stamp st-${esc(st)}">aposta · ${esc(RESULT[st] || st)}</span>` : ''}<span class="dy-date">${esc(fmtDate(e.at))}</span></div>
      </article>`; }).join('')}`);
  }
  pages.push(`<div class="dy-end"><div class="dy-orn">❦</div><p>continua…</p><span>A Maggie escreve as próximas páginas conforme vocês leem.</span></div>`);
  return pages;
}
let dyAt = 0, dyPages = [];
const dyTwo = () => innerWidth >= 900;
function openDiary(){ dyAt = 0; $('#diary').hidden = false; document.body.style.overflow = 'hidden'; renderDiary(); }
function closeDiary(){ $('#diary').hidden = true; document.body.style.overflow = ''; }
function renderDiary(){
  dyPages = diaryPages();
  const step = dyTwo() ? 2 : 1;
  dyAt = Math.max(0, Math.min(dyAt, dyPages.length - 1)); if (step === 2) dyAt -= dyAt % 2;
  const l = dyPages[dyAt] || '', r = step === 2 ? (dyPages[dyAt + 1] || '<div class="dy-blank"></div>') : '';
  $('#dy-l').innerHTML = `<div class="dy-in">${l}</div><span class="dy-num">${dyAt + 1}</span>`;
  $('#dy-r').innerHTML = step === 2 ? `<div class="dy-in">${r}</div>${dyPages[dyAt + 1] ? `<span class="dy-num">${dyAt + 2}</span>` : ''}` : '';
  $('#dy-r').hidden = step !== 2;
  $('#dy-l').scrollTop = 0; $('#dy-r').scrollTop = 0;
  $('#dy-prev').disabled = dyAt === 0; $('#dy-next').disabled = dyAt + step >= dyPages.length;
  $('#dy-pos').textContent = `${dyAt + 1}${step === 2 && dyPages[dyAt + 1] ? '–' + (dyAt + 2) : ''} de ${dyPages.length}`;
}
function dyTurn(d){
  const step = dyTwo() ? 2 : 1, n = dyAt + d * step;
  if (n < 0 || n >= dyPages.length) return;
  const bk = $('#dy-book'); bk.classList.remove('turn-l', 'turn-r'); void bk.offsetWidth; bk.classList.add(d > 0 ? 'turn-r' : 'turn-l');
  dyAt = n; renderDiary();
}
$('#dy-prev').onclick = () => dyTurn(-1);
$('#dy-next').onclick = () => dyTurn(1);
$('#dy-x').onclick = closeDiary;
$('#diary').addEventListener('click', e => { if (e.target.id === 'diary') closeDiary(); });
document.addEventListener('keydown', e => {
  if ($('#diary').hidden || !$('#jn-modal').hidden) return;
  if (e.key === 'ArrowRight') dyTurn(1); else if (e.key === 'ArrowLeft') dyTurn(-1); else if (e.key === 'Escape') closeDiary();
});
let dyX = null;
$('#dy-book').addEventListener('touchstart', e => { dyX = e.touches[0].clientX; }, { passive:true });
$('#dy-book').addEventListener('touchend', e => { if (dyX == null) return; const dx = e.changedTouches[0].clientX - dyX; dyX = null; if (Math.abs(dx) > 60) dyTurn(dx < 0 ? 1 : -1); });
window.addEventListener('resize', () => { if (!$('#diary').hidden) renderDiary(); });

let jnOpen = null, jnEdit = false, jnDel = false;
function openJn(id){ jnOpen = id; jnEdit = false; jnDel = false; $('#jn-modal').hidden = false; renderJnModal(); }
function closeJn(){ $('#jn-modal').hidden = true; jnOpen = null; }

function renderJnModal(){
  const e = jEntries.find(x => x.id === jnOpen); if (!e){ closeJn(); return; }
  const st = betStatus(e);
  const ed = jnEdit ? ' contenteditable="true" spellcheck="true"' : '';
  $('#jn-body').innerHTML = `
    <div class="jm-date">${esc(fmtDate(e.at, true))} · ${esc(fmtTime(e.at))}${e.chap ? ` · ${esc(e.chap)}` : ''}</div>
    <h3 class="jm-title" data-f="title"${ed}>${esc(e.title)}</h3>
    ${e.phrase || jnEdit ? `<p class="jm-phrase" data-f="phrase"${ed}>${esc(e.phrase || '')}</p>` : ''}
    ${e.quote ? `<blockquote class="jm-quote">“${esc(e.quote)}”</blockquote>` : ''}
    <div class="jm-talk">
      ${e.reaction ? `<p class="jm-line maggie"><b>Maggie</b><span>${esc(e.reaction)}</span></p>` : ''}
      ${e.question ? `<p class="jm-line maggie"><b>Maggie</b><span>${esc(e.question)}</span></p>` : ''}
      ${e.answer || jnEdit ? `<p class="jm-line you"><b>Você</b><span data-f="answer"${ed}>${esc(e.answer || '')}</span></p>` : ''}
      ${e.reply ? `<p class="jm-line maggie"><b>Maggie</b><span>${esc(e.reply)}</span></p>` : ''}
    </div>
    ${e.text || jnEdit ? `<p class="jm-text" data-f="text"${ed}>${esc(e.text || '')}</p>` : ''}
    <div class="jm-foot">
      ${e.mood ? `<span class="jn-mood">${esc(e.mood)}</span>` : ''}${st ? `<span class="jn-stamp st-${esc(st)}">aposta · ${esc(RESULT[st] || st)}</span>` : ''}
    </div>
    <div class="jm-acts">
      <button class="btn-j danger" id="jm-del">${jnDel ? 'Toque de novo para apagar' : 'Apagar'}</button>
      <span style="flex:1"></span>
      ${e.pi != null ? '<button class="btn-j" id="jm-go">Abrir no livro</button>' : ''}
      <button class="btn-j ${jnEdit ? 'primary' : ''}" id="jm-edit">${jnEdit ? 'Salvar' : 'Editar'}</button>
    </div>`;
}
document.addEventListener('click', e => { const j = e.target.closest('[data-jn]'); if (j && !$('#v-detail').hidden) openJn(j.dataset.jn); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-jn]')) openJn(e.target.dataset.jn); });
$('#jn-modal').addEventListener('click', async e => {
  if (e.target.id === 'jn-modal' || e.target.closest('#jn-x')) return closeJn();
  const ent = jEntries.find(x => x.id === jnOpen); if (!ent) return;
  const ref = () => S.db.doc(`companion/${S.cur}/journal/${ent.id}`);
  if (e.target.id === 'jm-go'){ closeJn(); openReader(S.cur, null, ent.pi); return; }
  if (e.target.id === 'jm-del'){
    if (!jnDel){ jnDel = true; renderJnModal(); setTimeout(() => { jnDel = false; if (!$('#jn-modal').hidden) renderJnModal(); }, 4000); return; }
    closeJn(); try { await ref().delete(); toast('Página apagada'); } catch { toast('Não consegui apagar agora.'); } return;
  }
  if (e.target.id === 'jm-edit'){
    if (!jnEdit){ jnEdit = true; renderJnModal(); $('#jn-body [data-f="answer"]')?.focus(); return; }
    const patch = {};
    $('#jn-body').querySelectorAll('[data-f]').forEach(el => { patch[el.dataset.f] = el.innerText.trim().slice(0, 500); });
    if (!patch.title) patch.title = ent.title;
    jnEdit = false;
    try { await ref().update(patch); toast('Página atualizada'); } catch { toast('Não consegui salvar agora.'); renderJnModal(); }
  }
});

function vcReset(){ clearTimeout(V.timer); V.pending = null; V.hold = false; V.wasPlaying = false; vc.value = ''; vcBox.classList.remove('listening'); }


})();
</script>
