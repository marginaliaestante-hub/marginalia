<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marginália</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Kalam:wght@400&display=swap">
<style>
/* Layout: uma estante de capas em grade; o livro abre numa ficha com mural de post-its; o leitor ocupa a tela inteira sem nada além do texto. */
:root{
  --bg:#F3EEF4; --surface:#FCF9FC; --ink:#2A1F2D; --muted:#7B6C80; --line:#E3D9E6;
  --accent:#8C3A69; --accent-ink:#FFF; --accent-soft:#F2DDEA; --shadow:rgba(60,30,60,.16);
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-book:"Literata", Georgia, "Times New Roman", serif;
  --f-hand:"Kalam", "Comic Sans MS", cursive;
  --pi-yellow:#FBE78C; --pi-pink:#F8C6D8; --pi-green:#CBE7B6; --pi-blue:#C3DEF2; --pi-lilac:#DDCDF3;
  --pi-ink:#3A2C30;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121A; --surface:#211A25; --ink:#F1E8F2; --muted:#A898AC; --line:#352B3A;
  --accent:#E7A0C6; --accent-ink:#2A1222; --accent-soft:#3B2436; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#211A25; --ink:#F1E8F2; --muted:#A898AC; --line:#352B3A;
  --accent:#E7A0C6; --accent-ink:#2A1222; --accent-soft:#3B2436; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}

/* ---------- header ---------- */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,76px);line-height:.9;margin:0;letter-spacing:-.01em}
.brand h1 i{color:var(--accent)}
.brand p{margin:10px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:#B4234A;border-color:currentColor}
.btn svg{width:16px;height:16px}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap}

.notice{border:1px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);margin-bottom:20px;font-size:14px}

/* ---------- reading now ---------- */
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:36px}
.now-card{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;width:100%}
.now-card .cover{width:64px;flex:none}
.now-card .meta{min-width:0;flex:1}
.now-card .t{font-family:var(--f-display);font-size:22px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-card .a{color:var(--muted);font-size:13px;margin-bottom:10px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.now-card .pct{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab span{font-variant-numeric:tabular-nums;opacity:.6;margin-left:4px;font-size:12px}

/* ---------- shelf grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:28px 20px}
.book{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.book .t{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .a{color:var(--muted);font-size:13px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .stars-sm{color:var(--accent);font-size:12px;letter-spacing:1px;margin-top:-6px}
.cover{position:relative;isolation:isolate;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 7px 7px 3px;overflow:hidden;background:var(--line);box-shadow:0 1px 2px var(--shadow),0 10px 24px -8px var(--shadow);transition:transform .25s ease, box-shadow .25s ease}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.22) 0,rgba(255,255,255,.18) 2.5%,rgba(0,0,0,.06) 5%,transparent 9%);pointer-events:none}
.book:hover .cover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 2px 4px var(--shadow),0 18px 30px -10px var(--shadow)}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14% 12%;color:#fff}
.gen b{font-family:var(--f-display);font-weight:400;font-size:clamp(16px,2.2vw,22px);line-height:1.05}
.gen small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.badge{position:absolute;top:8px;right:8px;background:var(--pi-yellow);color:var(--pi-ink);font-family:var(--f-hand);font-size:13px;padding:1px 8px 0;border-radius:2px;transform:rotate(4deg);box-shadow:0 2px 4px rgba(0,0,0,.15);z-index:1}

.add{border:1.5px dashed var(--line);border-radius:3px 7px 7px 3px;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);background:transparent;padding:12px;text-align:center;transition:border-color .2s,color .2s}
.add:hover,.add.drag{border-color:var(--accent);color:var(--accent)}
.add svg{width:28px;height:28px}
.add small{font-size:12px}
.empty{grid-column:1/-1;padding:28px 0;color:var(--muted);font-family:var(--f-display);font-size:24px;font-style:italic}

.job{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:20px}
.job .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex:none}
.job.err .spin{display:none}
.job.err{border-color:#B4234A}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- detail ---------- */
.view[hidden]{display:none!important}
.back{background:none;border:0;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:6px 0;margin-bottom:18px;font-weight:500}
.back:hover{color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:48px;align-items:start}
.d-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.d-side .cover{max-width:300px}
.d-title{font-family:var(--f-display);font-size:clamp(34px,5vw,52px);line-height:1;margin:0;border:0;background:none;width:100%;color:var(--ink);padding:0;resize:none;overflow:hidden}
.d-author{font-size:17px;color:var(--muted);border:0;background:none;width:100%;padding:0;margin-top:8px}
.d-title:focus,.d-author:focus{outline:none;box-shadow:0 1px 0 var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stars{display:inline-flex;gap:2px;font-size:28px;line-height:1;color:var(--line);user-select:none}
.star{position:relative;width:28px;height:28px;display:inline-block}
.star::before{content:"★";position:absolute;inset:0}
.star .fill{position:absolute;inset:0;overflow:hidden;color:var(--accent);width:0}
.star .fill::before{content:"★"}
.star button{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0}
.star button:last-of-type{right:0}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
.review{width:100%;min-height:96px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-family:var(--f-book);font-size:15px;line-height:1.6;resize:vertical}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.board-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 18px;flex-wrap:wrap}
.board-head h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0}
.board-head h2 i{color:var(--accent)}

/* ---------- post-its ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.postit{--rot:-1.2deg;position:relative;border:0;text-align:left;background:var(--pi-yellow);color:var(--pi-ink);padding:22px 16px 14px;min-height:150px;display:flex;flex-direction:column;gap:10px;transform:rotate(var(--rot));box-shadow:0 1px 1px rgba(0,0,0,.08),0 12px 18px -10px rgba(0,0,0,.35);transition:transform .2s ease}
.postit:nth-child(3n+2){--rot:1deg}
.postit:nth-child(3n){--rot:-.4deg}
.postit:hover{transform:rotate(0) translateY(-3px) scale(1.02);z-index:2}
.postit::before{content:"";position:absolute;top:-9px;left:50%;width:64px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.postit .q{font-family:var(--f-book);font-style:italic;font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.postit .n{font-family:var(--f-hand);font-size:17px;line-height:1.3;white-space:pre-wrap}
.postit .pg{margin-top:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;font-variant-numeric:tabular-nums}
.c-yellow{background:var(--pi-yellow)} .c-pink{background:var(--pi-pink)} .c-green{background:var(--pi-green)} .c-blue{background:var(--pi-blue)} .c-lilac{background:var(--pi-lilac)}
.board-empty{grid-column:1/-1;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;font-family:var(--f-hand);font-size:19px}

/* ---------- reader ---------- */
.rd{--paper:#FBF8F3;--pink:#2B2420;--rmuted:#8E847C;--chrome:rgba(251,248,243,.94);--hl-a:.55;
  position:fixed;inset:0;z-index:50;background:var(--paper);color:var(--pink);display:flex;flex-direction:column}
.rd[data-paper="sepia"]{--paper:#F2E7D0;--pink:#4A3A28;--rmuted:#8F7A5E;--chrome:rgba(242,231,208,.94)}
.rd[data-paper="noite"]{--paper:#131015;--pink:#D9CFD6;--rmuted:#7D7280;--chrome:rgba(19,16,21,.94);--hl-a:.32}
.rd[hidden]{display:none}
.rd-top{position:absolute;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--chrome);backdrop-filter:blur(8px);border-bottom:1px solid color-mix(in srgb,var(--pink) 10%,transparent);transform:translateY(-102%);transition:transform .28s ease}
.rd.chrome .rd-top{transform:none}
.rd-top .ttl{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--pink);flex:none}
.ib:hover{background:color-mix(in srgb,var(--pink) 8%,transparent)}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="true"]{background:color-mix(in srgb,var(--pink) 12%,transparent)}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--pink) 18%,transparent);border-radius:999px;padding:2px;flex:none}
.seg button{background:none;border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--rmuted)}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--paper)}
.rd-menu{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:6;background:var(--paper);color:var(--pink);border:1px solid color-mix(in srgb,var(--pink) 14%,transparent);border-radius:16px;padding:14px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;min-width:240px}
.rd-menu .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rmuted);font-weight:600}
.papers{display:flex;gap:8px}
.papers button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;font-family:var(--f-book);font-size:15px}
.papers button[aria-pressed="true"]{border-color:var(--accent)}
.fs{display:flex;align-items:center;gap:10px}
.fs button{border:1px solid color-mix(in srgb,var(--pink) 18%,transparent);background:none;border-radius:10px;width:44px;height:36px;font-family:var(--f-book)}
.fs output{flex:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--rmuted);font-size:13px}

.rd-stage{flex:1;min-height:0;position:relative;padding:calc(56px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.rd-vp{position:relative;height:100%;width:100%;max-width:1240px;overflow:hidden}
.rd-vp.single{max-width:640px}
.flow{height:100%;font-family:var(--f-book);font-size:var(--fs,19px);line-height:1.68;column-fill:auto;hyphens:auto;-webkit-hyphens:auto;text-align:justify;overflow-wrap:break-word}
.flow p{margin:0;text-indent:1.5em;orphans:2;widows:2}
.flow h2+p,.flow p.first{text-indent:0}
.flow h2{font-family:var(--f-display);font-weight:400;font-size:1.65em;line-height:1.1;text-align:center;margin:1.6em 0 1em;break-after:avoid;text-indent:0;text-wrap:balance}
.flow .gap{height:.9em}
.flow mark{color:inherit;border-radius:2px;padding:.05em 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.flow mark.c-yellow{background:rgba(250,214,60,var(--hl-a))}
.flow mark.c-pink{background:rgba(245,140,180,var(--hl-a))}
.flow mark.c-green{background:rgba(140,210,110,var(--hl-a))}
.flow mark.c-blue{background:rgba(110,180,235,var(--hl-a))}
.flow mark.c-lilac{background:rgba(180,150,240,var(--hl-a))}
.flow mark.has-note::after{content:"";display:inline-block;width:.55em;height:.55em;margin-left:.15em;background:var(--pi-yellow);transform:rotate(8deg) translateY(-.55em);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.flow mark.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{background:rgba(250,190,30,.95)}}
.flow ::selection{background:rgba(140,58,105,.28)}
.rd-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--rmuted);font-family:var(--f-display);font-size:22px;font-style:italic;padding:24px}
.rd-foot{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;font-size:12px;color:var(--rmuted);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .28s ease;pointer-events:none}
.rd.chrome .rd-foot{opacity:1;pointer-events:auto}
.rd-foot input{flex:1;accent-color:var(--accent)}

.pdfv{position:absolute;inset:0;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;background:color-mix(in srgb,var(--pink) 6%,var(--paper))}
.pdfv[hidden]{display:none}
.pp{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);width:min(100%,860px)}
.pp canvas{display:block;width:100%;height:auto}
.pp .pn{position:absolute;bottom:-18px;right:0;font-size:11px;color:var(--rmuted)}

/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;z-index:7;width:min(380px,92vw);background:color-mix(in srgb,var(--pink) 5%,var(--paper));border-left:1px solid color-mix(in srgb,var(--pink) 12%,transparent);transform:translateX(102%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px 20px}
.drawer h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.drawer .list{flex:1;overflow:auto;padding:16px 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.drawer .postit{min-height:0}
.drawer .none{font-family:var(--f-hand);font-size:18px;color:var(--rmuted);text-align:center;padding:30px 10px}

/* popover */
.pop{position:absolute;z-index:8;background:#2A1F2D;color:#fff;border-radius:999px;padding:6px;display:flex;align-items:center;gap:4px;box-shadow:0 10px 24px -6px rgba(0,0,0,.4);transform:translate(-50%,0)}
.pop[hidden]{display:none}
.pop .dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.pop .dot[aria-pressed="true"]{border-color:#fff}
.pop .sep{width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 2px}
.pop .pb{background:none;border:0;color:#fff;font-size:13px;font-weight:500;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.pop .pb:hover{background:rgba(255,255,255,.12)}
.pop .pb svg{width:15px;height:15px}

/* note modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,10,20,.45);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.note-card{width:min(420px,100%);background:var(--pi-yellow);color:var(--pi-ink);padding:28px 22px 18px;transform:rotate(-1deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);position:relative;display:flex;flex-direction:column;gap:12px}
.note-card::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.6)}
.note-card blockquote{margin:0;font-family:var(--f-book);font-style:italic;font-size:14px;line-height:1.5;max-height:7.5em;overflow:auto;opacity:.85}
.note-card textarea{background:transparent;border:0;border-top:1px dashed rgba(58,44,48,.3);padding-top:10px;min-height:120px;resize:vertical;font-family:var(--f-hand);font-size:20px;line-height:1.35;color:var(--pi-ink)}
.note-card textarea:focus{outline:none}
.note-card .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.note-card .acts button.del{background:none;color:#B4234A;padding-left:4px}

.dy-laces b{font-family:var(--f-display);font-weight:400;font-size:18px}
.dy-laces span{font-family:var(--f-hand);font-size:15px;color:#8C3A69}
.dy-people{display:flex;flex-direction:column;gap:14px}
.dy-person{border-bottom:1px dashed rgba(58,44,48,.18);padding-bottom:12px}
.dy-pn{display:flex;align-items:baseline;gap:10px}
.dy-pn b{font-family:var(--f-display);font-weight:400;font-size:22px}
.dy-pn span{font-size:12px;font-weight:600;color:#8C3A69}
.dy-person p{margin:4px 0 0;font-size:14px;line-height:1.5}
.dy-bets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:16px}
.dy-bets li{position:relative;border:1px solid rgba(58,44,48,.14);border-radius:10px;padding:12px 14px 30px;background:#fff}
.dy-bets .q{margin:0;font-size:14px}.dy-bets .a{margin:6px 0 0;font-family:var(--f-hand);font-size:18px}
.dy-bets .jn-stamp{position:absolute;right:10px;bottom:8px}
.dy-ch{text-align:center;margin-bottom:8px}
.dy-ch small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
.dy-ch h3{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:40px;margin:2px 0 0}
.dy-facts{margin:0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:6px}
.dy-facts li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.45}
.dy-facts li::before{content:"✦";position:absolute;left:0;top:0;color:#C0587F;font-size:11px}
.dy-entry{margin-top:22px;padding:16px 16px 12px;background:#fff;border-radius:3px;box-shadow:0 8px 16px -12px rgba(60,30,50,.5);cursor:pointer;transform:rotate(-.4deg);transition:transform .2s}
.dy-entry:nth-of-type(2n){transform:rotate(.4deg)}
.dy-entry:hover{transform:none}
.dy-entry blockquote{margin:0 0 10px;font-family:var(--f-book);font-style:italic;font-size:14px;line-height:1.55;border-left:2px solid rgba(140,58,105,.4);padding-left:10px}
.dy-entry h5{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:22px}
.dy-phrase{margin:2px 0 10px;font-family:var(--f-hand);font-size:17px;color:#8C3A69}
.dy-line{margin:6px 0 0;font-size:13.5px;line-height:1.5;display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.dy-line b{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;padding-top:3px}
.dy-line.you{font-family:var(--f-hand);font-size:16px}
.dy-tags{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dy-tags .jn-stamp{position:static}
.dy-date{margin-left:auto;font-size:11px;opacity:.5}
.dy-end{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.dy-end p{margin:0;font-family:var(--f-display);font-style:italic;font-size:30px}
.dy-end span{font-size:13px;opacity:.6;max-width:30ch}
@media (max-width:899px){ .dy-page{padding:34px 22px 44px;border-radius:8px} .dy-title h2{font-size:38px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['yellow','pink','green','blue','lilac'];
const STATUS = [['lendo','Lendo'],['quero','Quero ler'],['lido','Lido'],['abandonado','Abandonei']];
const TABS = [['lendo','Lendo'],['quero','Quero ler'],['lido','Lidos'],['abandonado','Abandonados'],['todos','Todos']];
const store = {
  get(k, d){ try { const v = localStorage.getItem('mg.'+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('mg.'+k, JSON.stringify(v)); } catch {} }
};
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const S = {
  db:null, assets:null, dl:null, ready:false,
  books:[], hls:[], tab: store.get('tab','lendo'),
  cur:null,            // open book id (detail/reader)
  paras:null, pdf:null, pdfBuf:null,
  mode:'flow', page:0, pages:1, stride:1, pageOf:[], para:0, pdfPage:1,
  fs: store.get('fs', 19), paper: store.get('paper','papel'),
};

/* ---------------- utils ---------------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const book = id => S.books.find(b => b.id === id);
const blob = id => id ? '_blob/' + id : '';
const today = () => new Date().toISOString().slice(0,10);
function hue(str){ let h=0; for (const c of String(str)) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }
function coverHTML(b){
  if (b.cover) return `<img src="${blob(b.cover)}" alt="" loading="lazy" onerror="this.remove()">` + genCover(b, true);
  return genCover(b);
}
function genCover(b, under){
  const h = hue(b.title||'x');
  return `<div class="gen" style="background:linear-gradient(160deg,hsl(${h} 38% 42%),hsl(${(h+40)%360} 45% 24%));${under?'z-index:-1':''}"><b>${esc(b.title||'Sem título')}</b><small>${esc(b.author||'')}</small></div>`;
}
function starsText(r){ if(!r) return ''; return '★'.repeat(Math.floor(r)) + (r%1 ? '½' : ''); }
const bookHls = id => S.hls.filter(h => h.bookId === id).sort((a,b)=> a.s.p-b.s.p || a.s.o-b.s.o);
async function saveBook(id, patch){
  if (!S.db) return;
  try { await S.db.doc('books/'+id).update(patch); }
  catch(e){ toast('Não consegui salvar agora. Tente de novo.'); }
}

/* ---------------- boot ---------------- */
function noticeMsg(html){ $('#notice').innerHTML = html ? `<div class="notice">${html}</div>` : ''; }
renderShelf();
(async () => {
  const use = n => (window.claude && claude.use) ? claude.use(n) : Promise.resolve(null);
  const [db, assets, dl] = await Promise.all([use('db'), use('assets'), use('downloads')]);
  S.db = db; S.assets = assets; S.dl = dl;
  if (!db){ noticeMsg('Entre na sua conta para ver sua estante.'); return; }
  if (!assets) noticeMsg('Não consegui acessar o armazenamento de arquivos.');
  if (dl) $('#b-backup').hidden = false, $('#d-export').hidden = false;
  const timer = setTimeout(()=>{ if(!S.ready) noticeMsg('Ainda carregando sua estante… a conexão está lenta.'); }, 10000);
  db.collection('books').onSnapshot(snap => {
    S.books = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if (!snap.metadata.fromCache){ S.ready = true; clearTimeout(timer); if(assets) noticeMsg(''); }
    renderShelf(); if (!$('#v-detail').hidden) renderDetail();
  }, () => noticeMsg('Não consegui abrir sua estante. Recarregue a página.'));
  db.collection('highlights').onSnapshot(snap => {
    const touched = new Set();
    snap.docChanges().forEach(ch => { const d = ch.doc.data(); if (d && d.bookId === S.cur && d.s) for (let i=d.s.p;i<=d.e.p;i++) touched.add(i); });
    S.hls = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(h => h.s && h.e);
    renderShelfStats();
    if (!$('#v-detail').hidden) renderBoard();
    if (!$('#rd').hidden){ touched.forEach(i => rerenderPara(i)); renderDrawer(); }
  }, () => {});
})();

/* ---------------- shelf ---------------- */
function renderShelfStats(){
  const yr = new Date().getFullYear();
  const lidos = S.books.filter(b => b.status==='lido' && (b.finished||'').startsWith(String(yr))).length;
  const n = S.hls.length;
  $('#stats').textContent = S.books.length
    ? `${S.books.length} ${S.books.length===1?'livro':'livros'} na estante · ${lidos} ${lidos===1?'lido':'lidos'} em ${yr} · ${n} ${n===1?'post-it':'post-its'}`
    : 'Sua estante, seus grifos, seus post-its.';
}
function renderShelf(){
  renderShelfStats();
  const reading = S.books.filter(b => b.status==='lendo').sort((a,b)=>(b.lastRead||0)-(a.lastRead||0));
  $('#now-wrap').hidden = !reading.length;
  $('#now').innerHTML = reading.slice(0,3).map(b => `
    <button class="now-card" data-open="${b.id}" data-go="read">
      <div class="cover">${coverHTML(b)}</div>
      <div class="meta"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author||'')}</div>
      <div class="bar"><i style="width:${b.pct||0}%"></i></div><div class="pct">${b.pct||0}% · continuar lendo</div></div>
    </button>`).join('');
  const count = k => k==='todos' ? S.books.length : S.books.filter(b=>b.status===k).length;
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}<span>${count(k)}</span></button>`).join('');
  const list = S.books.filter(b => S.tab==='todos' || b.status===S.tab).sort((a,b)=>(b.added||0)-(a.added||0));
  const nh = id => S.hls.filter(h=>h.bookId===id).length;
  const empties = {lendo:'Nenhum livro aberto agora.', quero:'Sua lista de desejos está vazia.', lido:'Nenhum livro terminado ainda.', abandonado:'Nenhum abandonado. Que bom!', todos:'Sua estante está esperando o primeiro livro.'};
  $('#grid').innerHTML = (S.assets ? `<button class="add" id="dropzone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Adicionar livro</span><small>PDF ou EPUB</small><small>ou arraste aqui</small></button>` : '')
    + (list.length ? list.map(b => `
    <button class="book" data-open="${b.id}">
      <div class="cover">${nh(b.id)?`<span class="badge">${nh(b.id)}</span>`:''}${coverHTML(b)}</div>
      <div class="t">${esc(b.title)}</div>
      <div class="a">${esc(b.author||'')}</div>
      ${b.rating?`<div class="stars-sm">${starsText(b.rating)}</div>`:''}
    </button>`).join('') : `<div class="empty">${empties[S.tab]}</div>`);
  const dz = $('#dropzone');
  if (dz){
    dz.onclick = () => $('#f-pdf').click();
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
    dz.ondragleave = () => dz.classList.remove('drag');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); [...e.dataTransfer.files].filter(f=>/\.(pdf|epub)$/i.test(f.name)||f.type==='application/pdf'||f.type==='application/epub+zip').forEach(addBook); };
  }
}
document.addEventListener('click', e => {

/* ---------------- add book ---------------- */
function jobUI(name){
  const el = document.createElement('div'); el.className='job';
  el.innerHTML = `<div class="spin"></div><div><b>${esc(name)}</b><div class="msg" style="color:var(--muted);font-size:13px">Abrindo o PDF…</div></div>`;
  $('#jobs').prepend(el);
  return { msg:t => el.querySelector('.msg').textContent=t, done:()=>el.remove(), fail:t=>{ el.classList.add('err'); el.querySelector('.msg').textContent=t; setTimeout(()=>el.remove(),9000);} };
}
function cleanName(n){ return n.replace(/\.(pdf|epub)$/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim(); }
async function addBook(file){
  if (/\.epub$/i.test(file.name) || file.type === 'application/epub+zip') return addEpub(file);
  const job = jobUI(cleanName(file.name));
  if (!S.assets || !S.db) return job.fail('Entre na sua conta para adicionar livros.');
  if (file.size > 50*1024*1024) return job.fail(`Esse PDF tem ${(file.size/1048576).toFixed(0)} MB e o limite é 50 MB por arquivo.`);
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
    let title = cleanName(file.name), author = '';
    try { const m = await pdf.getMetadata(); if (m.info?.Title && m.info.Title.trim().length > 2 && !/untitled|microsoft|\.doc/i.test(m.info.Title)) title = m.info.Title.trim(); if (m.info?.Author) author = m.info.Author.trim(); } catch {}
    job.msg('Criando a capa…');
    const coverBlob = await renderCover(pdf);
    const paras = await extract(pdf, (p,n) => job.msg(`Formatando o texto… página ${p} de ${n}`));
    job.msg('Guardando na estante…');
    const up = await S.assets.upload(file, { type:'application/pdf' });
    const tx = await S.assets.upload(new Blob([JSON.stringify({ v:1, paras })], {type:'application/json'}), { type:'application/json' });
    let cv = null; try { if (coverBlob) cv = (await S.assets.upload(coverBlob, {type:'image/jpeg'})).id; } catch {}
    const ref = S.db.collection('books').doc();
    await ref.set({ title, author, status:'quero', rating:0, review:'', pdf: up.id, text: tx.id, cover: cv, autoCover: !!cv, pages: pdf.numPages, paraCount: paras.length, pct:0, added: Date.now(), started:'', finished:'', progress:{ para:0, pdfPage:1 } });
    job.done(); toast(`“${title}” entrou na estante`);
    if (S.tab !== 'quero' && S.tab !== 'todos'){ S.tab='quero'; store.set('tab','quero'); renderShelf(); }
  } catch (e) {
    console.error(e);
    const c = e && e.code;
    job.fail(c==='quota_or_state' ? 'O espaço de armazenamento da estante acabou.' : c==='too_large' ? 'O arquivo passou de 20 MB.' : 'Não consegui ler esse PDF. Ele pode estar protegido por senha.');
  }
}

/* ---------------- EPUB ---------------- */
const BLOCK = new Set(['P','DIV','H1','H2','H3','H4','H5','H6','LI','BLOCKQUOTE','SECTION','ARTICLE','PRE','DD','DT','FIGCAPTION','TD','TH','HEADER','FOOTER','ASIDE','UL','OL','DL','TABLE','TR','TBODY','FIGURE','HR','BODY','MAIN','NAV','ADDRESS','CENTER']);
const SKIP = new Set(['SCRIPT','STYLE','HEAD','TITLE','SVG','svg','IMG','image','RT','RP','RUBY']);
const BLOCK_SEL = [...BLOCK].map(t=>t.toLowerCase()).join(',');
function resolvePath(base, rel){
  rel = decodeURIComponent(rel.split('#')[0]);
  const parts = (base.includes('/') ? base.slice(0, base.lastIndexOf('/')+1) : '') .concat(rel).split('/');
  const out = []; for (const p of parts){ if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p); }
  return out.join('/');
}
function parseXml(str, type){
  let d = new DOMParser().parseFromString(str, type || 'application/xhtml+xml');
  if (d.getElementsByTagName('parsererror').length) d = new DOMParser().parseFromString(str, 'text/html');
  return d;
}
const byLocal = (root, name) => [...root.getElementsByTagName('*')].filter(e => (e.localName || e.nodeName).toLowerCase().replace(/^.*:/,'') === name);
function htmlToParas(doc, chap, out){
  const body = doc.body || byLocal(doc, 'body')[0]; if (!body) return;
  const push = (txt, h) => { txt = txt.replace(/[\s ]+/g, ' ').trim(); if (txt) out.push(h ? { t: txt, p: chap, h: 1 } : { t: txt, p: chap }); };
  const walk = (el, inHead) => {
    let buf = '';
    const tag = (el.localName || el.nodeName).toUpperCase();
    const head = inHead || /^H[1-6]$/.test(tag);
    for (const n of el.childNodes){
      if (n.nodeType === 3){ buf += n.nodeValue; continue; }
      if (n.nodeType !== 1) continue;
      const t = (n.localName || n.nodeName).toUpperCase();
      if (SKIP.has(t) || SKIP.has(n.localName)) continue;
      if (t === 'BR'){ buf += ' '; continue; }
      if (n.getAttribute && /pagebreak|page-break/.test(n.getAttribute('epub:type') || n.getAttribute('role') || '') && !n.textContent.trim()) continue;
      const isBlock = BLOCK.has(t) || (n.querySelector && n.querySelector(BLOCK_SEL));
      if (!isBlock){ buf += n.textContent; continue; }
      push(buf, head); buf = '';
      walk(n, head);
    }
    push(buf, head);
  };
  walk(body, false);
}
async function addEpub(file){
  const job = jobUI(cleanName(file.name));
  if (!S.assets || !S.db) return job.fail('Entre na sua conta para adicionar livros.');
  if (!window.JSZip) return job.fail('Não consegui carregar o leitor de EPUB. Recarregue a página.');
  try {
    const zip = await JSZip.loadAsync(file);
    const read = p => { const f = zip.file(p) || zip.file(Object.keys(zip.files).find(k => k.toLowerCase() === p.toLowerCase()) || ''); return f; };
    const cont = read('META-INF/container.xml'); if (!cont) throw new Error('not epub');
    const opfPath = byLocal(parseXml(await cont.async('string'), 'application/xml'), 'rootfile')[0]?.getAttribute('full-path');
    const opf = parseXml(await read(opfPath).async('string'), 'application/xml');
    const txt = name => (byLocal(opf, name)[0]?.textContent || '').trim();
    let title = txt('title') || cleanName(file.name); const author = byLocal(opf, 'creator').map(e => e.textContent.trim()).filter(Boolean).join(', ');
    const items = {}; byLocal(opf, 'item').forEach(it => items[it.getAttribute('id')] = { href: resolvePath(opfPath, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' });
    const spine = byLocal(opf, 'itemref').map(r => items[r.getAttribute('idref')]).filter(it => it && /html|xml/.test(it.type));
    job.msg('Formatando o texto…');
    const paras = []; let chap = 0;
    for (let k = 0; k < spine.length; k++){
      const f = read(spine[k].href); if (!f) continue;
      job.msg(`Formatando o texto… capítulo ${k+1} de ${spine.length}`);
      const before = paras.length;
      htmlToParas(parseXml(await f.async('string')), chap + 1, paras);
      if (paras.length > before) chap++;
    }
    if (paras.length < 3){
      throw new Error(read('META-INF/encryption.xml') ? 'drm' : 'empty');
    }
    job.msg('Criando a capa…');
    let coverItem = Object.values(items).find(it => /cover-image/.test(it.props));
    if (!coverItem){ const m = byLocal(opf, 'meta').find(m => m.getAttribute('name') === 'cover'); if (m) coverItem = items[m.getAttribute('content')]; }
    if (!coverItem) coverItem = Object.values(items).find(it => /^image\//.test(it.type) && /cover/i.test(it.href));
    let cv = null;
    if (coverItem && read(coverItem.href)){
      try {
        const raw = await read(coverItem.href).async('blob');
        const img = await createImageBitmap(new Blob([raw], { type: coverItem.type || 'image/jpeg' }));
        const sc = Math.min(1, 900 / img.height); const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const jb = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
        cv = (await S.assets.upload(jb, { type:'image/jpeg' })).id;
      } catch {}
    }
    job.msg('Guardando na estante…');
    const tx = await S.assets.upload(new Blob([JSON.stringify({ v:1, paras })], {type:'application/json'}), { type:'application/json' });
    await S.db.collection('books').doc().set({ title, author, format:'epub', status:'quero', rating:0, review:'', pdf:null, text: tx.id, cover: cv, autoCover: !!cv, pages: chap, paraCount: paras.length, pct:0, added: Date.now(), started:'', finished:'', progress:{ para:0, pdfPage:1 } });
    job.done(); toast(`“${title}” entrou na estante`);
    if (S.tab !== 'quero' && S.tab !== 'todos'){ S.tab='quero'; store.set('tab','quero'); renderShelf(); }
  } catch (e) {
    console.error(e);
    const c = e && e.code, m = e && e.message;
    job.fail(m === 'drm' ? 'Esse EPUB tem proteção contra cópia (DRM), então não dá para abrir o texto.' : c==='quota_or_state' ? 'O espaço de armazenamento da estante acabou.' : c==='too_large' ? 'O texto deste livro passou do limite de 20 MB.' : 'Não consegui ler esse EPUB. O arquivo pode estar corrompido.');
  }
}

async function renderCover(pdf){
  try {
    const page = await pdf.getPage(1);
    const v0 = page.getViewport({ scale:1 });
    const vp = page.getViewport({ scale: 640 / v0.width });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  } catch { return null; }
}

/* text extraction → paragraphs [{t, p, h}] */
async function extract(pdf, onProg){
  const out = []; let cur = null; let prevLine = null;
  const ends = s => /[.!?…:;"”»)]\s*$/.test(s);
  for (let p = 1; p <= pdf.numPages; p++){
    onProg && onProg(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale:1 });
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim() !== '' || (it.str===' ')).map(it => {
      const t = it.transform; const h = Math.hypot(t[2], t[3]) || it.height || 10;
      return { s: it.str, x: t[4], y: t[5], w: it.width, h };
    }).filter(it => it.s.trim() !== '');
    items.sort((a,b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    for (const it of items){
      let L = lines.find(l => Math.abs(l.y - it.y) < Math.min(l.h, it.h) * 0.5);
      if (!L){ L = { y: it.y, h: it.h, parts: [] }; lines.push(L); }
      L.parts.push(it); L.h = Math.max(L.h, it.h);
    }
    lines.sort((a,b) => b.y - a.y);
    const L2 = [];
    for (const L of lines){
      L.parts.sort((a,b) => a.x - b.x);
      let text = '', endX = null;
      for (const it of L.parts){
        if (endX !== null && it.x - endX > it.h * 0.18 && !text.endsWith(' ') && !it.s.startsWith(' ')) text += ' ';
        text += it.s; endX = it.x + it.w;
      }
      text = text.replace(/\s+/g, ' ').trim();
      if (!text) continue;
      const top = vp.height - L.y;
      if (/^[\divxlcIVXLC]{1,5}$/.test(text) || /^[-–—\s]*\d{1,4}[-–—\s]*$/.test(text)) continue; // page numbers
      if ((top < vp.height*0.06 || L.y < vp.height*0.05) && text.length < 70 && lines.length > 6) continue; // running headers/footers
      L2.push({ text, y: L.y, h: L.h, x0: L.parts[0].x, x1: endX });
    }
    if (!L2.length) continue;
    const hs = L2.map(l => l.h).sort((a,b)=>a-b); const body = hs[Math.floor(hs.length/2)];
    const x0s = L2.map(l => l.x0).sort((a,b)=>a-b); const left = x0s[Math.floor(x0s.length*0.2)];
    const x1s = L2.map(l => l.x1).sort((a,b)=>a-b); const right = x1s[Math.floor(x1s.length*0.85)];
    let prev = null;
    for (const l of L2){
      const heading = l.h > body * 1.28 && l.text.length < 120;
      const gap = prev ? prev.y - l.y : 0;
      const prevShort = prev ? prev.x1 < right - body * 2 : (prevLine ? prevLine.short : true);
      const prevEnd = cur ? ends(cur.t) : true;
      const indent = l.x0 - left > body * 0.9 && l.x0 - left < (right-left)*0.3;
      let brk = !cur || heading !== !!cur.h ||
        (prev && gap > Math.max(prev.h, l.h) * 1.9) ||
        (prevShort && prevEnd) || (indent && prevEnd && !heading);
      if (heading && cur && cur.h && prev && gap < l.h * 1.8) brk = false;
      if (brk){ if (cur) out.push(cur); cur = { t: l.text, p, h: heading ? 1 : 0 }; }
      else {
        if (/[A-Za-zÀ-ÿ]-$/.test(cur.t) && /^[a-zà-ÿ]/.test(l.text)) cur.t = cur.t.slice(0,-1) + l.text;
        else cur.t += ' ' + l.text;
      }
      prev = l;
    }
    prevLine = { short: prev.x1 < right - body * 2 };
  }
  if (cur) out.push(cur);
  return out.map(o => ({ t: o.t.replace(/\s+/g,' ').trim(), p: o.p, ...(o.h ? {h:1} : {}) })).filter(o => o.t);
}

const rd = $('#rd'), vp = $('#vp'), flow = $('#flow');
rd.dataset.paper = S.paper; flow.style.setProperty('--fs', S.fs+'px'); $('#fs-v').textContent = S.fs;
let saveT, chromeT;
async function openReader(id, jumpTo, atPara){
  const b = book(id); if (!b) return;
  S.cur = id; S.paras = null; S.pdf = null; S.pdfBuf = null; S.bookId = id;
  rd.hidden = false; document.body.style.overflow = 'hidden';
  $('#r-title').textContent = b.title;
  document.querySelector('.rd-top .seg').hidden = b.format === 'epub';
  flow.innerHTML = ''; $('#pdfv').hidden = true; $('#pdfv').innerHTML = '';
  msg('Abrindo o livro…');
  if (b.status === 'quero' || !b.status) saveBook(id, { status:'lendo', started: b.started || today() });
  try {
    if (b.text){ const r = await fetch(blob(b.text)); S.paras = (await r.json()).paras; }
    else if (b.pdf){ // book added from outside the page: build the text now
      msg('Formatando o livro pela primeira vez…');
      await loadPdf(b);
      S.paras = await extract(S.pdf, (p,n)=>msg(`Formatando o livro… página ${p} de ${n}`));
      if (S.assets){ try {
        const tx = await S.assets.upload(new Blob([JSON.stringify({v:1,paras:S.paras})],{type:'application/json'}),{type:'application/json'});
        const patch = { text: tx.id, paraCount: S.paras.length, pages: S.pdf.numPages };
        if (!b.cover){ const c = await renderCover(S.pdf); if (c) patch.cover = (await S.assets.upload(c,{type:'image/jpeg'})).id; }
        saveBook(id, patch);
      } catch {} }
    }
  } catch (e) { console.error(e); }
  if (S.cur !== id) return;
  const pr = b.progress || {};
  S.para = pr.para || 0; S.pdfPage = pr.pdfPage || 1;
  if (atPara != null && S.paras && S.paras[atPara]){ S.para = atPara; S.pdfPage = S.paras[atPara].p || S.pdfPage; }
  const hasText = S.paras && S.paras.length > 3;
  if (!hasText && !b.pdf){ msg('Não encontrei o texto deste livro.'); return; }
  if (!hasText){ setMode('pdf'); }
  else { setMode(b.format === 'epub' ? 'flow' : store.get('mode.'+id, 'flow')); }
  if (jumpTo) setTimeout(()=>jump(jumpTo), 60);
  renderDrawer();
  flashChrome();
  readingInit(id);
}
function msg(t){ const m = $('#r-msg'); m.hidden = !t; m.textContent = t || ''; }
function closeReader(){
  if (typeof closeAudio === 'function' && A.on) closeAudio();
  persist(true);
  S.audioPos = null;

let hlCache = [];
function paraHTML(i){
  const P = S.paras[i], t = P.t;
  const hs = hlCache.filter(h => h.s.p <= i && h.e.p >= i);
  if (!hs.length) return esc(t);
  const segs = [], bounds = new Set([0, t.length]);
  for (const h of hs){ const a = h.s.p < i ? 0 : Math.min(h.s.o, t.length), b = h.e.p > i ? t.length : Math.min(h.e.o, t.length); if (b > a){ segs.push({a,b,h}); bounds.add(a); bounds.add(b); } }
  const bs = [...bounds].sort((x,y)=>x-y); let out = '';
  for (let k = 0; k < bs.length-1; k++){
    const a = bs[k], b = bs[k+1]; if (b <= a) continue;
    const cov = segs.filter(s => s.a <= a && s.b >= b);
    const piece = esc(t.slice(a,b));
    if (!cov.length){ out += piece; continue; }
    const top = cov.reduce((x,y) => (y.h.created||0) >= (x.h.created||0) ? y : x).h;
    const last = top.note && top.e.p === i && b === Math.min(top.e.o, t.length);
    out += `<mark class="c-${top.color||'yellow'}${last?' has-note':''}" data-h="${top.id}">${piece}</mark>`;
  }

}

    else html += `<p data-i="${i}"${prevH?' class="first"':''}>${paraHTML(i)}</p>`;
    prevH = !!P.h;

function layout(anchorPara){

  vp.classList.toggle('single', !two);
  const W = vp.clientWidth, G = two ? 72 : 48;
  flow.style.columnCount = two ? 2 : 1; flow.style.columnGap = G + 'px';
  S.stride = W + G;
  const vr = vp.getBoundingClientRect(), sl = vp.scrollLeft;
  const els = flow.children; S.pageOf = new Array(els.length);
  for (let k = 0; k < els.length; k++){
    const r = els[k].getClientRects()[0] || els[k].getBoundingClientRect();

let io;
async function buildPdf(){

  box.innerHTML = '';
  if (!S.pdf){ msg('Carregando o PDF…'); try { await loadPdf(b); } catch { msg('Não consegui abrir o PDF.'); return; } }
  msg(''); if (S.mode !== 'pdf') return;
  const p1 = await S.pdf.getPage(1); const v = p1.getViewport({ scale:1 });
  const ratio = v.height / v.width;
  io && io.disconnect();
  io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) drawPage(en.target); }), { root: box, rootMargin: '800px 0px' });

    d.innerHTML = `<span class="pn">${n}</span>`; frag.appendChild(d); io.observe(d);

  }

    for (let i = c.start; i <= c.end; i++){ len += P[i].t.length; if (len > 9000 && i > s){ c.blocks.push({ id:`${n}-${c.blocks.length}`, start:s, end:i-1 }); s = i; len = P[i].t.length; } }
    c.blocks.push({ id:`${n}-${c.blocks.length}`, start:s, end:c.end }); });

}
const chapOf = pi => Math.max(0, A.chapters.findIndex(c => pi >= c.start && pi <= c.end));
const blockOf = pi => { const c = A.chapters[chapOf(pi)]; return c.blocks.find(b => pi >= b.start && pi <= b.end); };

function segPara(t){
  const segs = [];
  const dash = t.match(/^\s*([—–]|-\s)/);
  if (dash){
    const re = /\s[—–]\s?|\s-\s/g; let last = 0, sp = true, m;
    while ((m = re.exec(t))){ if (m.index > last) segs.push({ a:last, b:m.index, sp }); last = m.index; sp = !sp; }
    segs.push({ a:last, b:t.length, sp });
    return segs.filter(s => t.slice(s.a,s.b).replace(/[\s—–-]/g,'').length);
  }
  const re = /[“"«][^“”"«»]{2,}?[”"»]/g; let last = 0, m;
  while ((m = re.exec(t))){
    if (m.index > last) segs.push({ a:last, b:m.index, sp:false });
    segs.push({ a:m.index, b:m.index + m[0].length, sp:true }); last = m.index + m[0].length;
  }
  if (last < t.length) segs.push({ a:last, b:t.length, sp:false });
  return segs.filter(s => t.slice(s.a,s.b).trim());
}
function sentences(t, a, b){
  const out = [], s = t.slice(a, b), re = /[^.!?…]*[.!?…]+["”»)]*\s*|[^.!?…]+$/g; let m, pos = 0;
  while ((m = re.exec(s)) && m[0].length){ const len = m[0].length; out.push([a+pos, a+pos+len]); pos += len; if (pos >= s.length) break; }
  if (!out.length) out.push([a,b]);
  // merge tiny pieces
  const merged = [];
  for (const r of out){ const prev = merged[merged.length-1]; if (prev && (t.slice(prev[0],prev[1]).trim().length < 18 || t.slice(r[0],r[1]).trim().length < 6)) prev[1] = r[1]; else merged.push([...r]); }
  return merged;
}
function buildUnits(c){
  const ch = A.chapters[c], units = [], P = S.paras;
  for (let pi = ch.start; pi <= ch.end; pi++){
    const t = P[pi].t;
    if (P[pi].h){ units.push({ pi, a:0, b:t.length, key:null }); continue; }
    for (const sg of segPara(t)){
      const key = sg.sp ? `${pi}:${sg.a}` : null;
      for (const [a,b] of sentences(t, sg.a, sg.b)) if (t.slice(a,b).trim()) units.push({ pi, a, b, key });
    }
  }
  return units;
}

const PLAN_V = 2;
const EMOS = ['sussurro','grito','choro','riso','raiva','medo','ironia','tristeza','animacao'];
const EMO_FX = { sussurro:{r:.9,p:.95,v:.55}, grito:{r:1.08,p:1.12,v:1}, choro:{r:.88,p:.94,v:.9}, tristeza:{r:.9,p:.94,v:.9}, riso:{r:1.06,p:1.08,v:1}, animacao:{r:1.07,p:1.06,v:1}, raiva:{r:1.05,p:.94,v:1}, medo:{r:1.1,p:1.05,v:.9}, ironia:{r:.95,p:1,v:1} };
const slugId = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_-]/g,'').slice(0,40);
function castBrief(){
  return Object.entries(A.meta.cast || {}).map(([id,c]) => ({ id, nome:c.name, ...(c.aliases?.length ? { apelidos:c.aliases } : {}), genero:c.gender, idade:c.age, ...(c.temper ? { temperamento:c.temper } : {}), ...(c.desc ? { jeito_de_falar:c.desc } : {}) }));
}
// Quem narra o capítulo deste parágrafo: id do personagem (1ª pessoa) ou 'narr'
function narrFor(pi){ const id = canon(A.meta?.plan?.pov?.[chapOf(pi)]); return id && A.meta.cast?.[id] ? id : 'narr'; }
// Capítulo mais adiantado que a leitora já ouviu (o elenco não mostra quem ainda não apareceu)
function seenChap(){ return Math.max(A.meta?.maxChap || 0, A.chap || 0); }
// Narra algum capítulo que a leitora já alcançou? (não entrega quem vai narrar mais adiante)
function narratesSeen(id){ const s = seenChap(); return Object.entries(A.meta?.plan?.pov || {}).some(([n, v]) => canon(v) === id && +n <= s); }
function visibleCast(){
  const s = seenChap();
  return Object.entries(A.meta?.cast || {}).filter(([,c]) => c.fixed || (c.firstChap ?? 0) <= s)
    .sort((a,b) => (narratesSeen(b[0]) - narratesSeen(a[0])));
}
const TITLES = /^(detetive|det|sr|sra|srta|dr|dra|senhor|senhora|dona|dom|policial|agente|oficial|xerife|tenente|sargento|capitao|professor|professora|prof|tia|tio|vovo|avo|padre|irma)$/;
const nameTokens = n => String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(t => t && !TITLES.test(t));
// "Daniel" e "Daniel Clarke", "Evans" e "Detetive Evans" são a mesma pessoa
function samePerson(a, b){
  const ta = nameTokens(a), tb = nameTokens(b); if (!ta.length || !tb.length) return false;
  if (ta.join(' ') === tb.join(' ')) return true;
  const [sh, lg] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
  return sh.length === 1 && lg[0] === sh[0] && sh[0].length > 2;
}
const canon = id => { let k = 0; while (id && A.meta?.alias?.[id] && k++ < 6) id = A.meta.alias[id]; return id; };
function findByName(n){
  const s = slugId(n); if (!s) return null;
  if (A.meta.alias?.[s]) return canon(s);
  const cast = Object.entries(A.meta.cast || {});
  const hit = cast.find(([id,c]) => id === s || slugId(c.name) === s || (c.aliases || []).some(x => slugId(x) === s))
    || cast.find(([,c]) => samePerson(c.name, n) || (c.aliases || []).some(x => samePerson(x, n)));
  return hit ? hit[0] : null;
}
// Junta personagens repetidos (mantém o nome que apareceu primeiro, para não entregar um sobrenome antes da hora)
function mergeDupes(){
  const m = A.meta; if (!m?.cast) return false;
  m.alias = m.alias || {}; let changed = false;
  const score = c => (c.narrates ? 1000 : 0) + (c.fixed ? 500 : 0) - (c.firstChap ?? 999);
  let again = true;
  while (again){
    again = false;
    const ids = Object.keys(m.cast);
    outer: for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
      const a = m.cast[ids[i]], b = m.cast[ids[j]];
      if (!a || !b || (a.fixed && b.fixed) || !samePerson(a.name, b.name)) continue;
      const [keep, drop] = score(a) >= score(b) ? [ids[i], ids[j]] : [ids[j], ids[i]];
      const K = m.cast[keep], D = m.cast[drop];
      K.aliases = [...new Set([...(K.aliases || []), D.name, ...(D.aliases || [])])].filter(x => x && x !== K.name).slice(0, 8);
      K.firstChap = Math.min(K.firstChap ?? 999, D.firstChap ?? 999);
      if (D.narrates) K.narrates = true;
      for (const f of ['temper', 'desc']) if (!K[f] && D[f]) K[f] = D[f];
      if ((!K.gender || /indefinid/.test(K.gender)) && D.gender) K.gender = D.gender;
      if ((!K.age || /indefinid/.test(K.age)) && D.age) K.age = D.age;
      delete m.cast[drop]; m.alias[drop] = keep;
      for (const n in (m.plan?.pov || {})) if (m.plan.pov[n] === drop) m.plan.pov[n] = keep;
      for (const k in A.labels) if (A.labels[k] === drop) A.labels[k] = keep;
      changed = again = true; break outer;
    }
  }

}
// Acrescenta um personagem (ou completa a ficha de um já conhecido, sem apagar ajustes da leitora)
function addCast(p, chap){
  if (!p) return null;
  const cast = A.meta.cast || (A.meta.cast = {});
  const id = slugId(p.id || p.nome);
  if (!id || ['narrador','narr','nenhum'].includes(id)) return null;
  const aliases = Array.isArray(p.apelidos) ? p.apelidos.map(x => String(x).slice(0,40)).filter(Boolean) : [];
  const c = cast[id] || (findByName(p.nome) && cast[findByName(p.nome)]);
  if (c){
    if (!c.temper && p.temperamento) c.temper = String(p.temperamento).slice(0,80);
    if (!c.desc && (p.jeito_de_falar || p.descricao)) c.desc = String(p.jeito_de_falar || p.descricao).slice(0,120);
    if (aliases.length) c.aliases = [...new Set([...(c.aliases || []), ...aliases])].slice(0,6);
    if ((!c.gender || /indefinid/.test(c.gender)) && p.genero) c.gender = p.genero;
    if ((!c.age || /indefinid/.test(c.age)) && p.idade) c.age = p.idade;
    if (chap != null && (c.firstChap == null || chap < c.firstChap)) c.firstChap = chap;

  }

    desc:String(p.jeito_de_falar || p.descricao || '').slice(0,120), temper:String(p.temperamento || '').slice(0,80),
    aliases:aliases.slice(0,6), firstChap: chap ?? 0, voice:'', pitch:1, rate:1 };
  return id;
}

function chapterOpening(c, max){

// Plano do livro: feito uma vez por livro, com o modelo mais caprichado, e guardado em audio/{livro}

Importante:

${known.length ? `- Personagens já conhecidos (reaproveite estes ids): ${JSON.stringify(known)}\n` : ''}

Responda só com JSON:
{"tipo_narracao":"primeira pessoa alternada|primeira pessoa única|terceira pessoa|mista","capitulos":[{"n":0,"narrador":"id do personagem|narrador|nenhum"}],"personagens":[{"id":"ana","nome":"Ana","apelidos":[],"genero":"feminino|masculino|indefinido","idade":"criança|jovem|adulta|idosa|indefinida","temperamento":"","jeito_de_falar":"","primeiro_capitulo":1}]}

// Lê a resposta da IA sobre as falas de um bloco
function readFalas(res, map, k, chap, only){

    const id = v ? slugId(v) : '';
    const lab = !id ? null : (id === 'narrador' || id === 'narr') ? 'narr' : (A.meta.cast[id] ? id : findByName(v));
    labels[key] = lab || null; if (!lab) nulls++;

function blockPrompt(blk, lines, k, extra){

Elenco conhecido: ${JSON.stringify(castBrief())}
${ctx ? `\nContexto anterior (sem marcações):\n${ctx}\n` : ''}
Trecho:
${lines.join('\n')}

Responda só com JSON neste formato:
{${askEu ? '"eu":"id de quem é o \\"eu\\" narrador deste trecho, ou null se não houver",' : ''}"personagens":[{"id":"helena","nome":"Helena","apelidos":[],"genero":"feminino|masculino|indefinido","idade":"criança|jovem|adulta|idosa|indefinida","temperamento":"até 8 palavras","jeito_de_falar":"até 8 palavras"}],"falas":{"1":{"q":"helena","e":"sussurro"},"2":{"q":null},"3":{"q":"narrador"}}}

function rangeLines(r){

// Analisa um intervalo de parágrafos; se o filtro do Google bloquear, tenta as duas metades separadas

function rangeFor(el, a, b){

const vc = $('#vc-in'), vcBox = $('#vc');
const V = { wasPlaying:false, timer:null, pending:null, busy:false };
const fine = matchMedia('(pointer:fine)').matches;
vc.placeholder = fine ? 'Win + H e fale com a Maggie' : 'Toque e use o microfone do teclado';
const deacc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const norm = s => deacc(s.toLowerCase()).replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

/* normalize with an index map back to the original string */
function normMap(t){
  let out = '', map = [], sp = true;
  for (let i = 0; i < t.length; i++){
    let c = deacc(t[i].toLowerCase());
    if (!/[a-z0-9]/.test(c)){ if (!sp){ out += ' '; map.push(i); sp = true; } continue; }
    for (const ch of c){ out += ch; map.push(i); } sp = false;
  }
  return { out, map };
}

function assistantVoice(){
  const nar = A.meta?.narrator?.voice;
  return A.voices.find(v => vNatural(v) && v.name !== nar && v.lang === 'pt-BR' && vGender(v) === 'feminina') || A.voices.find(v => v.name !== nar && vNatural(v)) || findVoice(nar) || defaultNarrator();
}
/* ---- voz própria da Maggie (Gemini TTS), com a voz do navegador como reserva ---- */
const MV = { audio:null, offUntil:0 };
const ttsCache = new Map();
const maggieVoiceOn = () => store.get('maggie.tts', true) && Date.now() > MV.offUntil && !!A.sample?.tts;
function maggieAudio(text){
  if (!maggieVoiceOn()) return Promise.resolve(null);
  if (!ttsCache.has(text)){
    ttsCache.set(text, A.sample.tts(text, { voice: store.get('maggie.voice', 'Laomedeia') }).catch(e => {
      if (e?.code === 'rate_limited'){ MV.offUntil = Date.now() + 3600e3; console.warn('[marginalia] voz da Maggie no limite; usando a voz do navegador por 1 hora'); }
      ttsCache.delete(text); return null;
    }));
    if (ttsCache.size > 40) ttsCache.delete(ttsCache.keys().next().value);
  }
  return ttsCache.get(text);
}
function playBlob(blob){
  return new Promise(res => {
    const a = MV.audio || (MV.audio = new Audio());
    const url = URL.createObjectURL(blob); let done = false;
    const fin = ok => { if (done) return; done = true; a.onended = a.onerror = a.onpause = null; URL.revokeObjectURL(url); res(ok); };
    a.onended = () => fin(true); a.onpause = () => fin(true); a.onerror = () => fin(false);
    a.src = url; a.play().catch(() => fin(false));
    setTimeout(() => fin(true), 90000);
  });
}
function say(text){
  return new Promise(async res => {
    vcMsg(text);
    stopSpeech();
    V.speaking = true;
    const blob = await maggieAudio(text);
    if (blob && await playBlob(blob)){ V.speaking = false; res(); return; }
    if (!syn){ V.speaking = false; res(); return; }
    const ut = new SpeechSynthesisUtterance(text); const v = assistantVoice();
    if (v){ ut.voice = v; ut.lang = v.lang; } else ut.lang = 'pt-BR';
    ut.rate = 1.05; let done = false; const fin = () => { if (!done){ done = true; V.speaking = false; res(); } };
    ut.onend = fin; ut.onerror = fin; setTimeout(fin, 15000);
    syn.speak(ut);
  });
}
function vcMsg(t){ const s = $('#ab-status'); s.textContent = t; s.classList.remove('busy'); clearTimeout(V.msgT); V.msgT = setTimeout(() => paintAb(), 6000); }

function holdForCommand(){
  if (V.hold) return;
  V.hold = true; V.wasPlaying = A.playing;
  if (A.playing) pause();
  vcBox.classList.add('listening');
}
function releaseHold(resume){

/* ---- programmatic highlight from a paragraph range ---- */
async function voiceHighlight(pi, a, b, color, note){
  const t = S.paras[pi].t;
  while (a < b && /\s/.test(t[a])) a++;
  while (b > a && /\s/.test(t[b-1])) b--;
  const id = await saveHighlight({ s:{ p:pi, o:a }, e:{ p:pi, o:b }, text: t.slice(a, b), color, note });
  return id;
}

/* ---- search only in what was already narrated ---- */
function readLimit(){ const L = A.lastFinishedUnit; return L ? { pi:L.pi, b:L.b } : null; }
function findQuote(q){
  const lim = readLimit(); if (!lim) return [];
  const nq = norm(q); if (nq.length < 4) return [];
  const exact = [];
  const from = Math.max(0, lim.pi - 400);
  for (let pi = lim.pi; pi >= from; pi--){
    const full = S.paras[pi].t, t = pi === lim.pi ? full.slice(0, lim.b) : full;
    const { out, map } = normMap(t);
    const hay = ' ' + out + ' ', needle = ' ' + nq + ' ';
    let k = hay.indexOf(needle);
    while (k >= 0){
      const a = map[k], b = map[Math.min(map.length-1, k + nq.length - 1)] + 1;
      exact.push({ pi, a, b, score:1 });
      k = hay.indexOf(needle, k + 1);
    }
    if (exact.length > 3) break;
  }
  if (exact.length) return exact;
  // fuzzy: sentence with most of the dictated words (recent chapters only)
  const words = nq.split(' ').filter(w => w.length > 2);
  if (words.length < 3) return [];
  const cands = [];
  for (let pi = lim.pi; pi >= Math.max(0, lim.pi - 150); pi--){
    const full = S.paras[pi].t, end = pi === lim.pi ? lim.b : full.length;
    for (const [a,b] of sentences(full, 0, end)){
      const ns = ' ' + norm(full.slice(a,b)) + ' ';
      const hit = words.filter(w => ns.includes(' ' + w + ' ') || ns.includes(' ' + w)).length / words.length;
      if (hit >= 0.75) cands.push({ pi, a, b, score:hit });
    }
  }
  cands.sort((x,y) => y.score - x.score);
  if (cands.length > 1 && cands[0].score - cands[1].score >= 0.2) return [cands[0]];
  return cands.slice(0, 3);
}

/* ---- local command parser ---- */
const COLOR_WORDS = { amarel:'yellow', rosa:'pink', verde:'green', azul:'blue', lilas:'lilac', roxo:'lilac', violeta:'lilac' };
function parseCommand(raw){
  let text = raw.trim();
  const w = text.match(/^.*\b(?:ei|hey|oi)?[,\s]*(?:maggie|magg?ie|mag+i|magui|meg+ie|meg+i|margin[aá]lia|marginal|margarida|claude|cloud)\b[,.!:\s]*/i);
  if (w) text = text.slice(w[0].length);
  const n = norm(text);
  if (!n) return { act:'none' };
  if (/^(continuar|continua|continue|pode continuar|retomar|retoma|play|seguir|segue|volta a ler|voltar a ler)\b/.test(n)) return { act:'play' };
  if (/^(pausar|pausa|pare|para|parar|stop)\b/.test(n)) return { act:'pause' };
  if (/^(pula|pular|avanca|avancar|proxima|próxima)\b/.test(n)) return { act:'next' };
  if (/^(repete|repetir|repita|de novo|volta|voltar)\b/.test(n)) return { act:'repeat' };
  if (/^(cancela|cancelar|esquece|deixa pra la|nada)\b/.test(n)) return { act:'cancel' };
  if (!/(destac|destaq|grif|marc|salv|post ?it|postit|anot|nota|sublinh)/.test(n)) return { act:'unknown', text };
  // note: after "anotação/nota/escreva/:" (from the original text, keeping accents and case)
  let note = '';
  const nm = text.match(/(?:com\s+(?:a\s+)?(?:anota[cç][aã]o|nota|observa[cç][aã]o)|(?:e\s+)?anot(?:e|a|ar)(?![a-zçã])(?:\s+que)?|(?:e\s+)?escrev(?:e|a|er)(?![a-z])(?:\s+que)?|(?:a\s+)?anota[cç][aã]o(?:\s+[ée])?|dizendo(?:\s+que)?)\s*[:,]?\s*/i);
  let head = text;
  if (nm){ note = text.slice(nm.index + nm[0].length).trim(); head = text.slice(0, nm.index); }
  else {
    const colon = text.indexOf(':');
    if (colon > 0 && /post|nota|parte|aqui/i.test(text.slice(0, colon))){ note = text.slice(colon+1).trim(); head = text.slice(0, colon); }
  }
  note = note.replace(/^["“'‘]|["”'’]\.?$/g, '').trim();
  if (note) note = note[0].toUpperCase() + note.slice(1);
  // quote: text in quotes, or after "a frase / o trecho / a parte"
  let quote = '';
  const qm = head.match(/["“'‘]([^"”'’]{4,})["”'’]/);
  if (qm) quote = qm[1];
  else {
    const fm = head.match(/(?:^|\s)(?:a\s+frase|o\s+trecho|a\s+parte|a\s+passagem|onde\s+diz|que\s+diz)\s*[:,]?\s+(.{6,})$/i);
    if (fm && !/^(que voc[eê]|que acabou|anterior|passada|de agora|atual)/i.test(fm[1].trim()) && !/^(ultima|última|essa|esta|aqui)/i.test(fm[1].trim())) quote = fm[1];
  }
  const hn = norm(head);
  let color = 'yellow';
  for (const [k,cv] of Object.entries(COLOR_WORDS)) if (new RegExp('\\b' + k).test(hn)) { color = cv; break; }
  let target = 'last';
  if (/(penultima|frase anterior|antes dessa|antes desta)/.test(hn)) target = 'prev';
  if (quote) target = 'quote';
  return { act:'highlight', target, quote: quote.trim(), note, color };
}

/* ---- Claude fallback for commands the rules did not understand ---- */
async function aiParse(text){
  if (!A.sample) return null;
  const L = A.lastFinishedUnit;
  const recent = L ? S.paras[L.pi].t.slice(Math.max(0, L.a - 300), L.b) : '';
  const prompt = `Interprete um comando falado para um leitor de audiobook. O texto foi transcrito por ditado e pode ter erros.
Comando: "${text}"
Últimas frases já ouvidas (para referência): "${recent}"

Ações possíveis: "destacar" (grifar um trecho, com ou sem anotação), "continuar", "pausar", "repetir", "pular", "nenhuma".
Responda só com JSON: {"acao":"destacar|continuar|pausar|repetir|pular|nenhuma","alvo":"ultima|anterior|citacao","citacao":"trecho exato citado, se houver","nota":"texto da anotação, se houver, exatamente como ditado","cor":"yellow|pink|green|blue|lilac"}`;
  try { return await A.sample.json(prompt, { modelTier:'quick', cache:false }); } catch { return null; }
}

/* ---- run ---- */
async function runCommand(raw){
  if (V.busy) return; V.busy = true;
  vc.value = ''; clearTimeout(V.timer);
  try {
    if (C.awaiting) return await compAnswer(raw);
    if (V.pending) return await answerPending(raw);
    let c = parseCommand(raw);
    if (c.act === 'unknown') return await compUserTalk(raw);
    if (c.act === 'unknown_ai'){
      vcMsg('Entendendo o comando…');
      const r = await aiParse(c.text);
      const map = { destacar:'highlight', continuar:'play', pausar:'pause', repetir:'repeat', pular:'next' };
      if (r && map[r.acao]) c = { act: map[r.acao], target: r.alvo === 'citacao' && r.citacao ? 'quote' : r.alvo === 'anterior' ? 'prev' : 'last', quote: r.citacao || '', note: r.nota || '', color: COLORS.includes(r.cor) ? r.cor : 'yellow' };
      else { await say('Não entendi o comando. Pode repetir?'); return; }
    }
    if (c.act === 'none'){ return; }
    if (c.act === 'play'){ V.wasPlaying = false; releaseHold(false); play(); return; }
    if (c.act === 'pause'){ V.wasPlaying = false; releaseHold(false); vcMsg('Pausado. Diga “continuar” para voltar.'); return; }
    if (c.act === 'cancel'){ releaseHold(true); return; }
    if (c.act === 'next'){ step(1); releaseHold(true); return; }
    if (c.act === 'repeat'){
      const L = A.lastFinishedUnit; const i = L ? A.units.findIndex(u => u.pi === L.pi && u.a === L.a) : -1;
      if (i >= 0) A.idx = i; releaseHold(false); play(); return;
    }
    if (c.act === 'highlight') return await doHighlight(c);
  } finally { V.busy = false; }
}
async function doHighlight(c){
  const L = A.lastFinishedUnit;
  if (!L){ await say('Ainda não terminei de ler nenhuma frase. Dê play primeiro.'); releaseHold(true); return; }
  if (c.target === 'quote'){
    const found = findQuote(c.quote);
    if (!found.length){ await say('Não encontrei esse trecho no que já li. Pode repetir a frase?'); return; }
    if (found.length > 1){
      V.pending = { c, found };
      const ords = ['primeiro','segundo','terceiro'];
      const ctx = f => { const t = S.paras[f.pi].t; let a0 = Math.max(0, f.a - 45), b0 = Math.min(t.length, f.b + 45); a0 = a0 ? t.indexOf(' ', a0) + 1 : 0; const sp = t.lastIndexOf(' ', b0); if (b0 < t.length && sp > f.b) b0 = sp; return '…' + t.slice(a0, b0).trim() + '…'; };
      const parts = found.slice(0,3).map((f,i) => `${ords[i]}${i===0?', o mais recente':''}: ${ctx(f)}`);
      await say(`Encontrei ${found.length > 3 ? 'mais de três' : found.length} trechos parecidos. ${parts.join('. ')}. Qual deles? Diga primeiro, segundo ou cancelar.`);
      vcMsg('Qual trecho? Diga “primeiro”, “segundo” ou “cancelar”.');
      return;
    }
    return await finishHighlight(found[0], c);
  }
  let target = { pi:L.pi, a:L.a, b:L.b };
  if (c.target === 'prev'){
    const i = A.units.findIndex(u => u.pi === L.pi && u.a === L.a);
    const p = i > 0 ? A.units[i-1] : null;
    if (!p){ await say('Não encontrei a frase anterior.'); return; }
    target = { pi:p.pi, a:p.a, b:p.b };
  }
  return await finishHighlight(target, c);
}
async function answerPending(raw){
  const n = norm(stripWake(raw));
  const { c, found } = V.pending;
  if (/(cancel|esquece|nenhum|deixa)/.test(n)){ V.pending = null; await say('Tudo bem, não marquei nada.'); releaseHold(true); return; }
  const idx = /(primeir|\b1\b|um\b)/.test(n) ? 0 : /(segund|\b2\b|dois)/.test(n) ? 1 : /(terceir|\b3\b|tres)/.test(n) ? 2 : -1;
  if (idx < 0 || !found[idx]){ await say('Não entendi. Diga primeiro, segundo ou cancelar.'); return; }
  V.pending = null;
  return await finishHighlight(found[idx], c);
}
async function finishHighlight(t, c){
  const id = await voiceHighlight(t.pi, t.a, t.b, c.color, c.note);
  if (!id){ await say('Não consegui salvar agora. Tente de novo.'); return; }
  await say(c.note ? 'Prontinho! Destaque e anotação salvos.' : 'Prontinho! Destaque salvo.');
  releaseHold(true);
}
